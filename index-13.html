<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D0102A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Smart School</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#D0102A;--blue-d:#A80C20;--navy:#1B1B24;--sky:#FDEBED;--paper:#FBF6F6;--line:#EBDADC;--text:#26202A;--muted:#6E6468;--orange:#F59E0B;--bad:#B3261E;--good:#17683A;
 --ink:#D0102A;--green:#D0102A;--mint:#FDEBED;--chalk:#F59E0B}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--paper);color:var(--text);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:inherit;margin:0;letter-spacing:-.01em;line-height:1.2;color:var(--navy);font-weight:700}
h2{font-size:1.35rem}h3{font-size:1.08rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.875rem}

/* welcome and auth screens */
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 22px 40px;position:relative;overflow:hidden;background:#FFF8F8}
.screen::before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;background:#F5B5BD;left:-150px;top:-170px;opacity:.75}
.screen::after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:var(--blue);right:-140px;bottom:-150px;opacity:.9}
.screen>*{position:relative;z-index:1}
.screen.center{justify-content:center}
.back{align-self:flex-start;background:#fff;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--navy);cursor:pointer;box-shadow:0 4px 14px rgba(208,16,42,.15)}
.logo{display:block;object-fit:contain}
.brand{font-size:1.6rem;text-align:center;color:var(--navy);font-weight:800}
.lead{margin:0;text-align:center;font-size:1.2rem;font-weight:500;color:var(--navy);max-width:320px}
.motto{margin:0;color:var(--muted);text-align:center}
.stack{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px}
.wide{max-width:380px}
.formcard{background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(208,16,42,.14);display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px}
.formhead{display:flex;flex-direction:column;align-items:center;gap:8px}

/* controls */
.btn{border:0;border-radius:999px;padding:14px 20px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;min-height:52px;box-shadow:0 8px 20px rgba(208,16,42,.28)}
.btn:disabled{opacity:.55;cursor:default}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--blue);box-shadow:none}
.btn.chalk{background:var(--orange);color:#1a1200;box-shadow:none}
.btn.bad{background:var(--bad)}
.btn.sm{padding:8px 14px;min-height:40px;font-size:.9rem;box-shadow:none}
.link{background:none;border:0;color:var(--blue);font-weight:700;text-decoration:underline;cursor:pointer;padding:8px 0;text-align:left}
.field{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:600;color:var(--navy)}
.field input,.field select,.field textarea,.inp{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;min-height:50px;width:100%;font-weight:400;color:var(--text)}
.field textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.note{padding:10px 14px;border-radius:14px;background:var(--sky);font-size:.92rem}
.note.bad{background:#FBE6E4;color:#7A1B14}
.note.good{background:#DCF1E3;color:#0F4D29}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.top h3{flex:1;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;font-weight:700}
.iconbtn{background:none;border:0;color:#fff;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.burger{width:22px;height:16px;position:relative}
.burger i{position:absolute;left:0;right:0;height:2.5px;background:#fff;border-radius:2px}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:6.5px}.burger i:nth-child(3){bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none}
.scrim{position:fixed;inset:0;background:rgba(30,5,10,.5);z-index:30}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:#fff;z-index:40;display:flex;flex-direction:column;box-shadow:6px 0 24px rgba(0,0,0,.2);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer .dhead{padding:22px 18px;background:var(--blue);color:#fff;display:flex;flex-direction:column;gap:4px}
.drawer .dhead h3{color:#fff}
.drawer nav{display:flex;flex-direction:column;padding:10px;gap:2px}
.drawer nav button{text-align:left;background:none;border:0;padding:14px 14px;border-radius:14px;font-weight:600;cursor:pointer;color:var(--navy)}
.drawer nav button.on{background:var(--sky);color:var(--blue);font-weight:700}
.drawer .dfoot{margin-top:auto;padding:14px}

/* dashboard */
.hero{background:var(--blue);color:#fff;padding:2px 16px 28px}
.hero.withstats{padding-bottom:0}
.wrap{max-width:760px;margin:0 auto}
.hero h2.hello{color:#fff;font-size:1.55rem;font-weight:800;padding:10px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;margin-bottom:-56px;position:relative}
.stat{background:#fff;border-radius:20px;padding:14px 8px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;box-shadow:0 10px 26px rgba(120,10,25,.16);color:var(--navy)}
.stat hr{width:70%;border:0;border-top:1px solid var(--line);margin:2px 0}
.statlabel{font-weight:700;font-size:.86rem;line-height:1.2}
.statnum{font-weight:800;font-size:1.35rem;color:var(--navy);line-height:1.1}
.statsub{font-size:.76rem;color:var(--muted)}
.ring{position:relative;width:64px;height:64px}
.ring svg{display:block}
.ringicon{position:absolute;inset:0;display:grid;place-items:center;color:var(--blue);font-weight:800;font-size:1.15rem}
.page{max-width:760px;margin:0 auto;padding:16px 14px 60px;display:flex;flex-direction:column;gap:14px}
.page.afterstats{padding-top:76px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.chip{flex:none;border:0;background:#fff;color:var(--navy);padding:11px 20px;border-radius:999px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(208,16,42,.1)}
.chip.on{background:var(--blue);color:#fff}
.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--blue);color:#fff;border-radius:20px;padding:16px;cursor:pointer;box-shadow:0 10px 24px rgba(208,16,42,.28)}
.banner .bicon{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;flex:none}
.banner .bt{font-weight:800;font-size:1.05rem}
.banner .bs{font-size:.86rem;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.banner .avatar{margin-left:auto;width:54px;height:54px;background:rgba(255,255,255,.95);font-size:1rem}
.todo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:11px 0;font-weight:600;color:var(--navy);cursor:pointer;font-size:1rem}
.todo svg{flex:none}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 16px rgba(208,16,42,.06)}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;width:100%;text-align:left;cursor:pointer}
.item:hover{border-color:var(--blue)}
.item .t{font-weight:700;color:var(--navy)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--sky);color:var(--blue);font-size:.78rem;font-weight:700}
.badge.warn{background:#FFF1C2;color:#6B5200}
.count{margin-left:auto;font-weight:800;font-size:1.3rem;color:var(--blue)}
.post-title{font-size:1.12rem}
.comment{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:11px;font-weight:700;cursor:pointer;color:var(--navy)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}.stat{padding:12px 4px}.statnum{font-size:1.15rem}.ring{width:54px;height:54px}.ring svg{width:54px;height:54px}}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}

.seg{display:flex;gap:6px}
.seg button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;color:var(--navy)}
.seg button.on-present{background:#17683A;border-color:#17683A;color:#fff}
.seg button.on-absent{background:#B3261E;border-color:#B3261E;color:#fff}
.seg button.on-late{background:#F59E0B;border-color:#F59E0B;color:#1a1200}
.seg button.on-excused{background:#D0102A;border-color:#D0102A;color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:700}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.sum div{background:var(--sky);border-radius:14px;padding:10px 4px}
.sum b{display:block;font-size:1.3rem;color:var(--navy)}
.sum span{font-size:.75rem;color:var(--muted)}
.page a{color:var(--blue);font-weight:600;word-break:break-all}
.vid{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
img.avatar{object-fit:cover;background:#fff}
.avatar.tint{background:var(--mint);color:var(--blue)}
.rx{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:1rem;cursor:pointer;display:inline-flex;gap:5px;align-items:center;min-height:36px}
.rx span{font-size:.82rem;font-weight:700;color:var(--muted)}
.rx.mine{background:var(--sky);border-color:var(--blue)}
.rx.mine span{color:var(--blue)}
.rx.add{font-weight:700;color:var(--navy)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:2px;max-height:230px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.picker button{background:none;border:0;font-size:1.6rem;line-height:1;padding:8px 0;border-radius:10px;cursor:pointer}
.picker button:active{background:var(--sky)}
</style>
</head>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
window.__showErr=function(m){var e=document.getElementById("err");e.style.display="block";e.textContent+=m+"\n";};

window.addEventListener("unhandledrejection",function(ev){__showErr("Error: "+((ev.reason&&ev.reason.message)||ev.reason));});

<script>
(function(){
const React = window.React;
const {useState,useEffect,useCallback} = React;
const {createRoot} = window.ReactDOM;
const htm = window.htm;
const {createClient} = window.supabase;

function parseStyle(str){
  const o = {};
  String(str).split(";").forEach(function(part){
    const i = part.indexOf(":");
    if(i < 1) return;
    const k = part.slice(0,i).trim(), v = part.slice(i+1).trim();
    if(!k || !v) return;
    o[k.indexOf("--") === 0 ? k : k.replace(/-([a-z])/g,function(_,c){return c.toUpperCase();})] = v;
  });
  return o;
}
function h(type, props){
  const kids = Array.prototype.slice.call(arguments, 2);
  if(props && typeof props.style === "string") props = Object.assign({}, props, {style: parseStyle(props.style)});
  return React.createElement.apply(null, [type, props].concat(kids));
}
const html = htm.bind(h);
const sb = createClient(
  "https://mdvhelcnsmxoxsxtbbxi.supabase.co",
  "sb_publishable__BK3bkWYwQOPTp2NINf1-g_bk8OMGyv"
);

const ROLE = {proprietor:"Proprietor",vice_principal:"Vice Principal",teacher:"Teacher",parent:"Parent",student:"Student",admin:"Administrator",pending:"Awaiting approval"};
const STUDENT_COLS = "id,admission_no,first_name,middle_name,surname,class_id,enrollment_status,profile_id,department";
const TERMS = {1:"First term",2:"Second term",3:"Third term"};
const DEPTS = ["Science","Art","Commercial"];
const fullName = p => [p && p.first_name, p && p.middle_name, p && p.surname].filter(Boolean).join(" ");
const when = d => new Date(d).toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"});
const initials = p => ((p && p.first_name || "?")[0] + (p && p.surname || "")[0]).toUpperCase();
const EMOJIS = "👍 ❤️ 😂 🎉 🙏 👏 😭 🥳 😇 😢 😥 🔙 🤔 😲 💕 😏 💬 🥱 🙂‍↕️ 🔥 🤣 ⚔️ ☺️ 🥹 😊 🙂 😌 😗 🤭 😐 ☹️ 😒 🫤 😓 🤐 🫥 🥺 🥸 😎 🤠 🤕 🥵 👿 ☃️ 👹 👻 🌝 ✨ 🙉 🌟 🙊 ⚡ 💯 💨 💙 💦 💖 🩷 💓 🤍 ❤️‍🩹 🫆 💟 🫀 💌 👤 🤲 👂 🤛 🦻 💪 👃 🦵 👐 🫴 ✌️ 🫳 🫰 ✊ 🖐️ 🖖 🤟 🤘 🤞 🤙 👇 👆 ☝️ 👈 👉 🫵 👌 🤏 🤌 ✍️ 🤳 💅 🤝 🙇 🙋 💁 🙆 🙅 🤷 🤦 🙍 🙎 🧏 💆 💇 🧖 🛀 🛌 🤾 🧍 🤸 👎 🙌 🫶 🧡 💛 💚 💜 🖤 🤎 💔 ❣️ 😀 😃 😄 😁 😆 😅 😉 😋 😍 🥰 😘 🤩 😜 🤗 😴 😮 😡 😬 😳 🤯 🤓 🎓 📚 🏆 ⭐ 🎊 🎈 ✅ ❌ 👀 💭".split(" ");

function Av({p,size,tint}){
  const url = p ? safeUrl(p.avatar_url) : null;
  const sz = size || 38;
  const st = {width:sz+"px",height:sz+"px",fontSize:Math.round(sz*0.38)+"px"};
  if(url) return html`<img class="avatar" src=${url} alt="" style=${st} loading="lazy" />`;
  return html`<span class=${"avatar"+(tint ? " tint" : "")} style=${st}>${initials(p)}</span>`;
}

function squareJpeg(file, size){
  return new Promise(function(resolve, reject){
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = function(){
      const m = Math.min(img.width, img.height);
      const c = document.createElement("canvas"); c.width = size; c.height = size;
      c.getContext("2d").drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? resolve(b) : reject(new Error("Could not process that photo")); }, "image/jpeg", 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("Could not read that photo")); };
    img.src = url;
  });
}

function Reactions({aid,rx,me,onReact,open,setOpen}){
  const mine = rx.filter(r=>r.announcement_id === aid);
  const counts = {}; const own = {};
  mine.forEach(r=>{ counts[r.emoji] = (counts[r.emoji]||0) + 1; if(r.user_id === me) own[r.emoji] = true; });
  const list = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  return html`<div class="stack" style="max-width:none;gap:8px">
    <div class="row" style="gap:6px">
      ${list.map(e=>html`<button key=${e} class=${"rx"+(own[e] ? " mine" : "")} onClick=${()=>onReact(aid,e)} aria-label=${"React with "+e}>${e} <span>${counts[e]}</span></button>`)}
      <button class="rx add" onClick=${()=>setOpen(open ? null : aid)} aria-label="Add a reaction">${open ? "Close" : "☺️ +"}</button>
    </div>
    ${open ? html`<div class="picker">${EMOJIS.map(e=>html`<button key=${e} onClick=${()=>onReact(aid,e)} aria-label=${"React with "+e}>${e}</button>`)}</div>` : null}
  </div>`;
}

const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent || "");
const isStandalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
const Field = ({label,children}) => html`<label class="field"><span>${label}</span>${children}</label>`;
const Note = ({kind,children}) => children ? html`<div class=${"note "+(kind||"")} role="status">${children}</div>` : null;
const Empty = ({children}) => html`<div class="empty">${children}</div>`;

/* ---------------- AUTH ---------------- */
function Logo({school,size}){
  if(school && school.logo_url) return html`<img class="logo" style=${{width:size,height:size}} src=${school.logo_url} alt="" />`;
  return html`<svg class="logo" width=${size} height=${size} viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="50,6 92,25 50,44 8,25" fill="#C8102E"/>
    <path d="M26 36v10c0 5 11 9 24 9s24-4 24-9V36L50 48z" fill="#8E0A1C"/>
    <path d="M86 28v16" stroke="#C8102E" strokeWidth="3" strokeLinecap="round"/>
    <circle cx="86" cy="49" r="4" fill="#C8102E"/>
    <path d="M12 60q19-7 38 3q19-10 38-3v30q-19-7-38 3q-19-10-38-3z" fill="#fff" stroke="#C8102E" strokeWidth="4" strokeLinejoin="round"/>
    <path d="M20 66q15-4 30 4q15-8 30-4v18q-15-4-30 4q-15-8-30-4z" fill="#E5384F"/>
  </svg>`;
}
const Back = ({onClick}) => html`<button type="button" class="back" onClick=${onClick} aria-label="Back"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg></button>`;

function Auth({school}){
  const [mode,setMode] = useState("welcome");
  const [f,setF] = useState({first:"",middle:"",surname:"",dob:"",phone:"",email:"",password:"",role:"student"});
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState(null);
  const set = k => e => setF({...f,[k]:e.target.value});
  const go = m => { setMsg(null); setMode(m); window.scrollTo(0,0); };
  const name = school ? school.name : "Smart School";

  async function login(e){
    e.preventDefault(); setBusy(true); setMsg(null);
    const {error} = await sb.auth.signInWithPassword({email:f.email.trim(),password:f.password});
    setBusy(false);
    if(error) setMsg({kind:"bad",text:error.message});
  }
  async function signup(e){
    e.preventDefault(); setMsg(null);
    if(!f.first.trim() || !f.surname.trim()) return setMsg({kind:"bad",text:"Enter your first name and surname."});
    if(f.password.length < 8) return setMsg({kind:"bad",text:"Use a password of at least 8 characters."});
    setBusy(true);
    const {data,error} = await sb.auth.signUp({
      email:f.email.trim(), password:f.password,
      options:{data:{first_name:f.first.trim(),middle_name:f.middle.trim(),surname:f.surname.trim(),date_of_birth:f.dob,phone:f.phone.trim(),requested_role:f.role}}
    });
    setBusy(false);
    if(error) return setMsg({kind:"bad",text:error.message});
    if(!data.session) setMsg({kind:"good",text:"Account created. Check your email to confirm it, then log in."});
  }
  async function forgot(e){
    e.preventDefault(); setBusy(true); setMsg(null);
    const {error} = await sb.auth.resetPasswordForEmail(f.email.trim(),{redirectTo:location.origin+location.pathname});
    setBusy(false);
    setMsg(error ? {kind:"bad",text:error.message} : {kind:"good",text:"If that email has an account, a reset link is on its way."});

  async function google(){
    const {error} = await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
    if(error) setMsg({kind:"bad",text:error.message});

  const note = html`<${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>`;
  const head = (title) => html`<div class="formhead"><${Logo} school=${school} size=${72} /><h2>${title}</h2></div>`;

  if(mode==="welcome") return html`<main class="screen center">
    <${Logo} school=${school} size=${120} />
    <h1 class="brand">${name}</h1>
    ${school && school.motto && !school.motto.startsWith("[") ? html`<p class="motto">${school.motto}</p>` : null}
    <p class="lead">Welcome to the Smart School Management System</p>
    <div class="stack wide" style="margin-top:18px">
      <button class="btn" onClick=${()=>go("signup")}>Sign Up</button>
      <button class="btn alt" onClick=${()=>go("login")}>Log In</button>
      <button class="btn" style="margin-top:14px" onClick=${google}>Continue with Google</button>
      ${note}
      ${isIos && !isStandalone ? html`<${Note}>On iPhone: tap the Share button, then Add to Home Screen, to install this app.<//>` : null}
    </div>
  </main>`;

  if(mode==="login") return html`<main class="screen">
    <${Back} onClick=${()=>go("welcome")} />
    ${head("Log in to "+name)}
    <form class="formcard" onSubmit=${login}>
      <${Field} label="Email"><input type="email" required autocomplete="email" value=${f.email} onInput=${set("email")} /><//>
      <${Field} label="Password"><input type="password" required autocomplete="current-password" value=${f.password} onInput=${set("password")} /><//>
      ${note}
      <button class="btn" disabled=${busy}>${busy ? "Logging in..." : "Log In"}</button>
      <button type="button" class="link" onClick=${()=>go("forgot")}>Forgot password?</button>
    </form>
  </main>`;

  if(mode==="forgot") return html`<main class="screen">
    <${Back} onClick=${()=>go("login")} />
    ${head("Reset your password")}
    <form class="formcard" onSubmit=${forgot}>
      <p class="muted" style="margin:0">Enter your email and we will send a link to set a new password.</p>
      <${Field} label="Email"><input type="email" required value=${f.email} onInput=${set("email")} /><//>
      ${note}
      <button class="btn" disabled=${busy}>Send reset link</button>
    </form>
  </main>`;

  return html`<main class="screen">
    <${Back} onClick=${()=>go("welcome")} />
    ${head("Create your account")}
    <form class="formcard" onSubmit=${signup}>
      <${Field} label="First name"><input required value=${f.first} onInput=${set("first")} autocomplete="given-name" /><//>
      <${Field} label="Middle name (if any)"><input value=${f.middle} onInput=${set("middle")} autocomplete="additional-name" /><//>
      <${Field} label="Surname"><input required value=${f.surname} onInput=${set("surname")} autocomplete="family-name" /><//>
      <${Field} label="Date of birth"><input type="date" value=${f.dob} onInput=${set("dob")} /><//>
      <${Field} label="Phone number"><input type="tel" value=${f.phone} onInput=${set("phone")} autocomplete="tel" /><//>
      <${Field} label="Email"><input type="email" required value=${f.email} onInput=${set("email")} autocomplete="email" /><//>
      <${Field} label="Password (8+ characters)"><input type="password" required minlength="8" value=${f.password} onInput=${set("password")} autocomplete="new-password" /><//>
      <${Field} label="I am a">
        <select value=${f.role} onChange=${set("role")}>
          <option value="student">Student</option>
          <option value="parent">Parent</option>
          <option value="teacher">Teacher</option>
          <option value="vice_principal">Vice Principal</option>
        </select>
      <//>
      <p class="small muted" style="margin:0">Staff and student accounts are checked by the school before they are active. Proprietor accounts are created by the school owner only.</p>
      ${note}
      <button class="btn" disabled=${busy}>${busy ? "Creating..." : "Create account"}</button>
    </form>
  </main>`;
}

function Recovery({school,done}){
  const [pw,setPw] = useState(""); const [msg,setMsg] = useState(null);
  async function save(e){
    e.preventDefault();
    if(pw.length < 8) return setMsg({kind:"bad",text:"Use at least 8 characters."});
    const {error} = await sb.auth.updateUser({password:pw});
    if(error) setMsg({kind:"bad",text:error.message}); else done();
  }
  return html`<main class="screen center"><${Logo} school=${school} size=${88} /><h2>Set a new password</h2>
    <form class="formcard" onSubmit=${save}>
      <${Field} label="New password"><input type="password" required minlength="8" value=${pw} onInput=${e=>setPw(e.target.value)} autocomplete="new-password" /><//>
      <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
      <button class="btn">Save password</button>
    </form></main>`;
}

function Pending({profile,school}){
  const off = profile && profile.status === "deactivated";
  return html`<main class="screen center"><${Logo} school=${school} size=${96} />
    <h2>${off ? "Account deactivated" : "Waiting for approval"}</h2>
    <p class="lead" style="font-size:1rem">${off ? "This account has been switched off. Please contact the school office." :
      "Thanks for registering"+(profile ? ", "+profile.first_name : "")+". The school needs to check your details before you can use the app. Come back after you have been approved."}</p>
    <div class="stack wide">
      <button class="btn alt" onClick=${()=>location.reload()}>Check again</button>
      <button class="btn" onClick=${()=>sb.auth.signOut()}>Log out</button>
    </div></main>`;
}

const money = n => { n = Math.round(n||0); return n >= 1e6 ? "\u20A6"+(n/1e6).toFixed(1)+"M" : "\u20A6"+n.toLocaleString("en-NG"); };
function Ring({pct,children}){
  const r = 26, c = 2*Math.PI*r, p = Math.min(1,Math.max(0,pct||0));
  return html`<div class="ring"><svg viewBox="0 0 64 64" width="64" height="64">
    <circle cx="32" cy="32" r=${r} fill="none" stroke="#F6D9DD" strokeWidth="5"/>
    <circle cx="32" cy="32" r=${r} fill="none" stroke="#D0102A" strokeWidth="5" strokeLinecap="round" strokeDasharray=${c} strokeDashoffset=${c*(1-p)} transform="rotate(-90 32 32)"/>
  </svg><div class="ringicon">${children}</div></div>`;
}
const IconCap = () => html`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5v4.5c0 1.2 2.2 2.5 5 2.5s5-1.3 5-2.5v-4.5"/></svg>`;
const IconBoard = () => html`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="11" rx="2"/><path d="M8 20h8M12 15v5"/></svg>`;
const IconMega = () => html`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 10v4h3l7 4V6L7 10z"/><path d="M17.5 9.5a4 4 0 010 5"/></svg>`;
const Tick = () => html`<svg viewBox="0 0 28 28" width="28" height="28"><circle cx="14" cy="14" r="12.5" fill="#FDEFF1" stroke="#F1C9CF" strokeWidth="1.5"/><path d="M8.5 14.5l3.8 3.8 7.2-7.6" fill="none" stroke="#D0102A" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>`;

function Media({a}){
  const img = safeUrl(a.image_url), att = safeUrl(a.attachment_url);
  if(!img && !att) return null;
  const yt = att ? /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/.exec(att) : null;
  const isVid = att ? /\.(mp4|mov|webm|3gp|m4v)(\?|$)/i.test(att) : false;
  return html`<div class="stack" style="max-width:none">
    ${img ? html`<img src=${img} alt="" style="width:100%;border-radius:14px" loading="lazy" />` : null}
    ${yt ? html`<div class="vid"><iframe src=${"https://www.youtube-nocookie.com/embed/"+yt[1]} title="Video" allow="accelerometer; encrypted-media; picture-in-picture" allowFullScreen></iframe></div>` :
      isVid ? html`<video controls playsInline preload="metadata" src=${att} style="width:100%;border-radius:14px;background:#000"></video>` :
      att ? html`<a href=${att} target="_blank" rel="noopener noreferrer">Open video link</a>` : null}
  </div>`;
}

function Home({profile,isOwner,role,go,school}){
  const [items,setItems] = useState(null);
  const [cm,setCm] = useState([]);
  const [names,setNames] = useState({});
  const [err,setErr] = useState("");
  const [title,setTitle] = useState(""); const [body,setBody] = useState("");
  const [file,setFile] = useState(null); const [fileKey,setFileKey] = useState(0); const [vlink,setVlink] = useState(""); const [posting,setPosting] = useState(false);
  const [open,setOpen] = useState({}); const [draft,setDraft] = useState({});
  const [rx,setRx] = useState([]); const [pickerFor,setPickerFor] = useState(null);
  const [stats,setStats] = useState(null); const [kidCount,setKidCount] = useState(null);
  const canPost = isOwner || (profile.permissions && profile.permissions.publish_announcements === true);

  const staff = seniors || role === "teacher";

  const load = useCallback(async()=>{
    const a = await sb.from("announcements").select("*").order("created_at",{ascending:false}).limit(30);
    if(a.error) return setErr(a.error.message);
    let comments = [];
    if(a.data.length){
      const c = await sb.from("announcement_comments").select("*").in("announcement_id",a.data.map(x=>x.id)).order("created_at");

    }
    let reacts = [];

      const r = await sb.from("reactions").select("announcement_id,user_id,emoji").in("announcement_id",a.data.map(x=>x.id)).range(0,4999);
      reacts = r.data || [];
    }
    setRx(reacts);
    const ids = [...new Set([...a.data.map(x=>x.author_id),...comments.map(x=>x.author_id)])];
    if(ids.length){
      const n = await sb.from("people_names").select("*").in("id",ids);
      const map = {}; (n.data||[]).forEach(p=>{map[p.id]=p;}); setNames(map);
    }
    setCm(comments); setItems(a.data);
  },[]);
  useEffect(()=>{load();},[load]);

  useEffect(()=>{
    if(seniors){
      (async()=>{
        const [act,all,tch,asg,fees,pend] = await Promise.all([
          sb.from("students").select("id",{count:"exact",head:true}).eq("enrollment_status","active"),
          sb.from("students").select("id",{count:"exact",head:true}),
          sb.from("staff_directory").select("id",{count:"exact",head:true}),
          sb.from("teaching_assignments").select("teacher_id"),
          sb.from("fee_summary").select("total_amount,amount_paid"),
          isOwner ? sb.from("profiles").select("id",{count:"exact",head:true}).eq("status","pending") : Promise.resolve({count:0})
        ]);
        const used = new Set((asg.data||[]).map(x=>x.teacher_id));
        const fe = fees.data || [];
        setStats({
          students:act.count||0, allStudents:all.count||0, teachers:tch.count||0, teachersUsed:used.size,
          paid:fe.reduce((t,x)=>t+Number(x.amount_paid||0),0), expected:fe.reduce((t,x)=>t+Number(x.total_amount||0),0), pending:pend.count||0
        });
      })();
    }
    if(role === "parent"){
      sb.from("parent_students").select("student_id",{count:"exact",head:true}).eq("parent_id",profile.id).then(r=>setKidCount(r.count||0));
    }
  },[seniors,isOwner,role,profile.id]);

  async function post(e){
    e.preventDefault(); setErr("");
    if(vlink.trim() && !safeUrl(vlink)) return setErr("The video link must start with http:// or https://");
    let image_url = null, attachment_url = safeUrl(vlink), path = null;
    setPosting(true);
    if(file){
      if(file.size > 50*1024*1024){ setPosting(false); return setErr("That file is over 50 MB. Choose a shorter video, or post a video link instead."); }
      if(!/^(video|image)\//.test(file.type)){ setPosting(false); return setErr("Choose a video or a photo."); }
      const ext = ((file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5)) || "bin";
      path = profile.id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2,8) + "." + ext;
      const up = await sb.storage.from("announcements").upload(path,file,{contentType:file.type,upsert:false});
      if(up.error){ setPosting(false); return setErr(up.error.message); }
      const url = sb.storage.from("announcements").getPublicUrl(path).data.publicUrl;
      if(file.type.indexOf("video/") === 0) attachment_url = url; else image_url = url;
    }
    const {error} = await sb.from("announcements").insert({title:title.trim(),body:body.trim(),image_url:image_url,attachment_url:attachment_url});
    setPosting(false);
    if(error){ if(path) sb.storage.from("announcements").remove([path]); return setErr(error.message); }
    setTitle(""); setBody(""); setVlink(""); setFile(null); setFileKey(fileKey+1); load();
  }
  async function react(aid, emoji){
    setErr("");
    const mine = rx.find(r=>r.announcement_id === aid && r.user_id === profile.id && r.emoji === emoji);
    if(mine){
      const {error} = await sb.from("reactions").delete().eq("announcement_id",aid).eq("user_id",profile.id).eq("emoji",emoji);
      if(error) return setErr(error.message);
      setRx(rx.filter(r=>r !== mine));
    } else {
      const {error} = await sb.from("reactions").insert({announcement_id:aid,emoji:emoji});
      if(error) return setErr(error.message);
      setRx(rx.concat([{announcement_id:aid,user_id:profile.id,emoji:emoji}]));
    }
    setPickerFor(null);
  }
  async function comment(id){
    const text = (draft[id]||"").trim(); if(!text) return;
    const {error} = await sb.from("announcement_comments").insert({announcement_id:id,body:text});
    if(error) return setErr(error.message);
    setDraft({...draft,[id]:""}); load();
  }
  async function hide(c){ await sb.from("announcement_comments").update({hidden:true}).eq("id",c.id); load(); }
  async function removePost(id){
    if(!confirm("Delete this announcement?")) return;
    const post = (items||[]).find(x=>x.id===id);
    const marker = "/object/public/announcements/";
    const paths = [];
    if(post){ [post.image_url, post.attachment_url].forEach(u=>{ if(u && u.indexOf(marker) > -1){ try { paths.push(decodeURIComponent(u.split(marker)[1].split("?")[0])); } catch(e){} } }); }
    const {error} = await sb.from("announcements").delete().eq("id",id);
    if(!error && paths.length) sb.storage.from("announcements").remove(paths);
    if(error) setErr(error.message); else load();
  }
  const who = id => names[id] ? fullName(names[id]) : "School";
  const toAnn = () => { const el = document.getElementById("ann"); if(el) el.scrollIntoView({behavior:"smooth"}); };
  const toForm = () => { const el = document.getElementById("annform"); if(el) el.scrollIntoView({behavior:"smooth"}); };
  const s = stats || {students:0,allStudents:0,teachers:0,teachersUsed:0,paid:0,expected:0,pending:0};
  const latest = items && items.length ? items[0] : null;

  return html`<div>
    <div class=${"hero"+(seniors?" withstats":"")}><div class="wrap">
      <h2 class="hello">Welcome, ${profile.first_name} ${profile.surname}</h2>
      ${school && school.current_session ? html`<div style="opacity:.92;font-weight:600">${school.current_session} \u00B7 ${TERMS[school.current_term] || ""}</div>` : null}
      ${seniors ? html`<div class="stats">
        <div class="stat"><${Ring} pct=${s.allStudents ? s.students/s.allStudents : 0}><${IconCap} /><//>
          <div class="statlabel">Total Students</div><hr/><div class="statnum">${s.students}</div><div class="statsub">Active students</div></div>
        <div class="stat"><${Ring} pct=${s.teachers ? s.teachersUsed/s.teachers : 0}><${IconBoard} /><//>
          <div class="statlabel">Total Teachers</div><hr/><div class="statnum">${s.teachers}</div><div class="statsub">Active teachers</div></div>
        <div class="stat"><${Ring} pct=${s.expected ? s.paid/s.expected : 0}>\u20A6<//>
          <div class="statlabel">Fee Revenue</div><hr/><div class="statnum">${money(s.paid)}</div><div class="statsub">Fees collected</div></div>
      </div>` : null}
    </div></div>

    <div class=${"page"+(seniors?" afterstats":"")}>
      ${staff ? html`<div class="chips">
        <button class="chip" onClick=${()=>go("classes")}>Students</button>
        <button class="chip" onClick=${()=>go("teachers")}>Teachers</button>
        <button class="chip" onClick=${()=>go("attendance")}>Attendance</button>
        <button class="chip" onClick=${()=>go("assignments")}>Assignments</button>
        ${isOwner ? html`<button class="chip" onClick=${()=>go("people")}>Accounts</button>` : null}
      </div>` : null}

      <button class="banner" onClick=${toAnn}>
        <span class="bicon"><${IconMega} /></span>
        <span><div class="bt">Recent Announcements</div><div class="bs">${latest ? latest.title : "Nothing posted yet"}</div></span>
        ${latest ? html`<${Av} p=${names[latest.author_id] || {first_name:"S",surname:"S"}} size=${54} />` : null}
      </button>

      ${role === "parent" && kidCount === 0 ? html`<div class="panel"><h3>Link your child</h3>
        <span class="muted">Add your child with the admission number and parent code from the school office.</span>
        <button class="btn sm" style="align-self:flex-start" onClick=${()=>go("profile")}>Link a child</button></div>` : null}

      ${isOwner ? html`<div class="panel"><h3>Pending Actions</h3>
        <button class="todo" onClick=${()=>go("people")}><${Tick} /> Approve accounts ${s.pending ? html`<span class="badge warn">${s.pending} waiting</span>` : null}</button>
        <button class="todo" onClick=${()=>go("classes")}><${Tick} /> Add students to classes</button>
        <button class="todo" onClick=${()=>go("teachers")}><${Tick} /> Assign teachers to subjects</button>
        <button class="todo" onClick=${toForm}><${Tick} /> Publish an announcement</button>
      </div>` : null}

      <h2 id="ann">Announcements</h2>
      <${Note} kind="bad">${err}<//>
      ${canPost ? html`<form class="panel" id="annform" onSubmit=${post}>

        <${Field} label="Details"><textarea required value=${body} onInput=${e=>setBody(e.target.value)}></textarea><//>
        <${Field} label="Video or photo from your phone (optional, up to 50 MB)"><input key=${fileKey} type="file" accept="video/*,image/*" onChange=${e=>setFile(e.target.files && e.target.files[0] ? e.target.files[0] : null)} /><//>

          const visible = mine.filter(c => !c.hidden);
          return html`<article class="panel" key=${a.id}>

            <${Reactions} aid=${a.id} rx=${rx} me=${profile.id} onReact=${react} open=${pickerFor===a.id} setOpen=${setPickerFor} />
            <div class="row">
              <button class="link" onClick=${()=>setOpen({...open,[a.id]:!open[a.id]})}>${visible.length} comment${visible.length===1?"":"s"}</button>

            </div>
            ${open[a.id] ? html`<div class="stack" style="max-width:none">
              ${visible.map(c => html`<div class="comment" key=${c.id}>
                <div class="row small" style="gap:6px;flex-wrap:nowrap"><${Av} p=${names[c.author_id]} size=${24} tint=${true} /><span><b>${who(c.author_id)}</b> <span class="muted">${when(c.created_at)}</span></span></div>
                <div>${c.body}</div>
                ${(isOwner || a.author_id===profile.id) ? html`<button class="link small" onClick=${()=>hide(c)}>Hide comment</button>` : null}
              </div>`)}
              <div class="row">
                <input class="inp grow" placeholder="Write a comment" maxlength="1000" value=${draft[a.id]||""} onInput=${e=>setDraft({...draft,[a.id]:e.target.value})} />
                <button class="btn sm" onClick=${()=>comment(a.id)}>Send</button>
              </div>
            </div>` : null}
          </article>`;
        })}
    </div>
  </div>`;
}

      ]);
      const ids = new Set((t.data||[]).concat(ct.data||[]).map(x=>x.class_id));
      rows = rows.filter(c=>ids.has(c.id));
    }
    setList(rows);
  },[profile]);
  useEffect(()=>{load();},[load]);

  const baseName = (LEVELS.find(l=>l[0]===level) || ["","JSS1"])[1];
  const useDept = Number(level) >= 4;
  const stream = [useDept ? dept : "", letter.trim().toUpperCase()].filter(Boolean).join(" ");
  const preview = baseName + (useDept && dept ? " " + dept : "") + (letter.trim() ? (useDept && dept ? " " : "") + letter.trim().toUpperCase() : "");
  async function add(e){
    e.preventDefault(); setErr("");
    const {error} = await sb.from("classes").insert({name:preview,level:Number(level),stream:stream||null});
    if(error) return setErr(error.message.includes("duplicate") ? "That class already exists." : error.message);
    setLetter(""); setDept(""); load();
  }

  if(sel) return html`<${ClassPage} cls=${sel} all=${list} isOwner=${isOwner} profile=${profile} back=${()=>{setSel(null);load();}} />`;
  return html`<div class="page">
    <h2>Classes</h2>
    <${Note} kind="bad">${err}<//>
    ${list === null ? html`<${Empty}>Loading...<//>` : list.length===0 ? html`<${Empty}>${profile.role==="teacher" ? "You have not joined a class yet. Open My classes in the menu." : "No classes yet."}<//>` :
      list.map(c => html`<button class="item" key=${c.id} onClick=${()=>setSel(c)}>
        <span class="t">${c.name}</span><span class="count">${c.student_count}</span><span class="small muted">students</span>
      </button>`)}
    ${isOwner ? html`<form class="panel" onSubmit=${add}>
      <h3>Add a class or stream</h3>
      <${Field} label="Level"><select value=${level} onChange=${e=>{setLevel(e.target.value); setDept("");}}>${LEVELS.map(l=>html`<option key=${l[0]} value=${l[0]}>${l[1]}</option>`)}</select><//>
      ${useDept ? html`<${Field} label="Department"><select value=${dept} onChange=${e=>setDept(e.target.value)}>
        <option value="">No department (all together)</option><option value="Science">Science</option><option value="Art">Art</option><option value="Commercial">Commercial</option></select><//>` : null}
      <${Field} label="Stream letter (optional, e.g. A or B)"><input maxlength="2" value=${letter} onInput=${e=>setLetter(e.target.value)} /><//>
      <div class="small muted">This will create: <b>${preview}</b></div>
      <button class="btn">Add class</button>
    </form>` : null}
  </div>`;
}

function ClassPage({cls,all,isOwner,profile,back}){
  const [students,setStudents] = useState(null); const [subs,setSubs] = useState([]);
  const [tn,setTn] = useState({}); const [codes,setCodes] = useState({});
  const [q,setQ] = useState(""); const [err,setErr] = useState(""); const [ok,setOk] = useState("");
  const [isCT,setIsCT] = useState(false); const [mainT,setMainT] = useState(null); const [targets,setTargets] = useState([]);
  const [pick,setPick] = useState({}); const [bulk,setBulk] = useState("");
  const [f,setF] = useState({adm:"",first:"",middle:"",surname:""});
  const canManage = isOwner || isCT;

  const load = useCallback(async()=>{
    const [st,as,tr,ct,tg] = await Promise.all([
      sb.from("students").select(STUDENT_COLS).eq("class_id",cls.id).order("surname"),
      sb.from("teaching_assignments").select("*, subjects(name)").eq("class_id",cls.id),
      sb.from("staff_directory").select("*"),
      sb.from("class_teachers").select("teacher_id").eq("class_id",cls.id).maybeSingle(),
      sb.from("classes").select("id,name,level").order("level").order("name")
    ]);
    if(st.error) return setErr(st.error.message);
    setStudents(st.data); setSubs(as.data||[]);
    const m = {}; (tr.data||[]).forEach(t=>{m[t.id]=t;}); setTn(m);
    setMainT(ct.data ? ct.data.teacher_id : null);
    setIsCT(!!(ct.data && ct.data.teacher_id === profile.id));
    setTargets(tg.data||[]);
    if(isOwner){
      const c = await sb.rpc("get_guardian_codes",{cid:cls.id});
      const cm = {}; (c.data||[]).forEach(r=>{cm[r.id]=r.guardian_code;}); setCodes(cm);
    }
  },[cls,isOwner,profile.id]);
  useEffect(()=>{load();},[load]);

  async function add(e){
    e.preventDefault(); setErr(""); setOk("");
    const {error} = await sb.from("students").insert({admission_no:f.adm.trim(),first_name:f.first.trim(),middle_name:f.middle.trim()||null,surname:f.surname.trim(),class_id:cls.id});
    if(error) return setErr(error.message);
    setF({adm:"",first:"",middle:"",surname:""}); load();
  }
  async function promote(s){
    setErr(""); setOk("");
    const to = pick[s.id];
    if(!to) return setErr("Choose the class to move "+s.first_name+" to.");
    const t = targets.find(c=>c.id===to);
    if(!confirm("Move "+fullName(s)+" to "+(t ? t.name : "that class")+"?")) return;
    const {error} = await sb.rpc("promote_student",{sid:s.id,to_cid:to});
    if(error) return setErr(error.message);
    setOk(fullName(s)+" moved to "+(t ? t.name : "the new class")+"."); load();
  }
  async function promoteAll(){
    setErr(""); setOk("");
    if(!bulk) return setErr("Choose the class to promote everyone to.");
    const t = targets.find(c=>c.id===bulk);
    if(!confirm("Move all active students in "+cls.name+" to "+(t ? t.name : "that class")+"?")) return;
    const {data,error} = await sb.rpc("promote_class",{from_cid:cls.id,to_cid:bulk});
    if(error) return setErr(error.message);
    setOk(data+" students moved to "+(t ? t.name : "the new class")+"."); setBulk(""); load();
  }
  async function setDept(s,v){
    setErr(""); setOk("");
    const {error} = await sb.rpc("set_student_department",{sid:s.id,dept:v||null});
    if(error) return setErr(error.message);
    load();
  }
  async function status(s,v){
    const {error} = await sb.from("students").update({enrollment_status:v}).eq("id",s.id);
    if(error) setErr(error.message); else load();
  }
  async function removeClass(){
    if(!confirm("Delete "+cls.name+"?")) return;
    const {error} = await sb.from("classes").delete().eq("id",cls.id);
    if(error) setErr(error.message); else back();
  }

  const active = (students||[]).filter(s=>s.enrollment_status==="active");
  const ql = q.trim().toLowerCase();
  const shown = (students||[]).filter(s => !ql || (fullName(s)+" "+s.admission_no).toLowerCase().includes(ql));
  const bySubject = {};
  subs.forEach(a=>{ const k=a.subjects ? a.subjects.name : "Subject"; (bySubject[k]=bySubject[k]||[]).push(a); });
  const others = targets.filter(c=>c.id!==cls.id);
  const showDept = Number(cls.level) >= 4;

  return html`<div class="page">
    <button class="link" onClick=${back}>Back to classes</button>
    <h2>${cls.name}</h2>
    <div class="panel"><div class="row"><span class="count" style="margin-left:0">${active.length}</span><span>registered students</span></div>
      <div class="small muted">Main class teacher: ${mainT ? (fullName(tn[mainT]) || "Teacher") : "not set yet"}</div></div>
    <${Note} kind="bad">${err}<//>
    <${Note} kind="good">${ok}<//>

    <div class="panel"><h3>Subjects and teachers</h3>
      ${Object.keys(bySubject).length===0 ? html`<span class="muted">No subjects assigned yet.</span>` :
        Object.keys(bySubject).sort().map(k => html`<div key=${k}><b>${k}</b>: ${bySubject[k].map(a=>fullName(tn[a.teacher_id])||"Teacher").join(", ")}</div>`)}
    </div>

    ${canManage && active.length > 0 ? html`<div class="panel"><h3>Promote the whole class</h3>
      <span class="muted small">At the end of the year, move every active student in ${cls.name} to the next class in one step.</span>
      <div class="row"><select class="inp grow" value=${bulk} onChange=${e=>setBulk(e.target.value)} aria-label="Promote class to">
        <option value="">Promote to...</option>${others.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select>
      <button class="btn sm" onClick=${promoteAll}>Promote all</button></div></div>` : null}

    <h3>Students</h3>
    <input class="inp" placeholder="Search by name or admission number" value=${q} onInput=${e=>setQ(e.target.value)} />
    ${students===null ? html`<${Empty}>Loading...<//>` : shown.length===0 ? html`<${Empty}>No students found.<//>` :
      shown.map(s => html`<div class="panel" key=${s.id}>
        <div class="row"><span class="t grow">${fullName(s)}</span>
          ${s.department ? html`<span class="badge">${s.department}</span>` : null}
          <span class=${"badge"+(s.enrollment_status==="active"?"":" warn")}>${s.enrollment_status}</span></div>
        <div class="small muted">Admission no. ${s.admission_no}${isOwner && codes[s.id] ? " \u00B7 Parent code: "+codes[s.id] : ""}</div>
        ${canManage ? html`<div class="row">
          <select class="inp grow" value=${pick[s.id]||""} onChange=${e=>setPick({...pick,[s.id]:e.target.value})} aria-label="Promote or move to class">
            <option value="">Promote or move to...</option>${others.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}
          </select>
          <button class="btn sm" onClick=${()=>promote(s)}>Move</button>
        </div>
        ${showDept ? html`<select class="inp" value=${s.department||""} onChange=${e=>setDept(s,e.target.value)} aria-label="Department">
          <option value="">Department not set</option>${DEPTS.map(d=>html`<option key=${d} value=${d}>${d}</option>`)}</select>` : null}
        ${isOwner ? html`<div class="row">${s.enrollment_status==="active" ? html`<button class="btn alt sm" onClick=${()=>status(s,"deactivated")}>Deactivate</button>` : html`<button class="btn alt sm" onClick=${()=>status(s,"active")}>Reactivate</button>`}</div>` : null}` : null}
      </div>`)}

    ${isOwner ? html`<form class="panel" onSubmit=${add}>
      <h3>Add a student to ${cls.name}</h3>
      <${Field} label="Admission number"><input required value=${f.adm} onInput=${e=>setF({...f,adm:e.target.value})} /><//>
      <div class="grid2">
        <${Field} label="First name"><input required value=${f.first} onInput=${e=>setF({...f,first:e.target.value})} /><//>
        <${Field} label="Surname"><input required value=${f.surname} onInput=${e=>setF({...f,surname:e.target.value})} /><//>
      </div>
      <${Field} label="Middle name (if any)"><input value=${f.middle} onInput=${e=>setF({...f,middle:e.target.value})} /><//>
      <button class="btn">Add student</button>
    </form>` : null}
    ${isOwner && students !== null && students.length === 0 ? html`<button class="btn alt sm" style="align-self:flex-start" onClick=${removeClass}>Delete this empty class</button>` : null}
  </div>`;
}

/* ---------------- TEACHERS ---------------- */
function Teachers({isOwner}){
  const [d,setD] = useState(null); const [q,setQ] = useState(""); const [tab,setTab] = useState("all");
  const [sel,setSel] = useState(null); const [sub,setSub] = useState(null); const [cls,setCls] = useState(null);
  const [newSub,setNewSub] = useState(""); const [err,setErr] = useState("");

  const load = useCallback(async()=>{
    const [t,a,s,c] = await Promise.all([
      sb.from("staff_directory").select("*").order("surname"),
      sb.from("teaching_assignments").select("*, subjects(name), classes(name)"),
      sb.from("subjects").select("*").order("name"),
      sb.from("classes").select("*").order("level").order("name")
    ]);
    if(t.error) return setErr(t.error.message);
    setD({teachers:t.data,assigns:a.data||[],subjects:s.data||[],classes:c.data||[]});
  },[]);
  useEffect(()=>{load();},[load]);

  async function addSubject(e){
    e.preventDefault(); setErr("");
    const {error} = await sb.from("subjects").insert({name:newSub.trim()});
    if(error) return setErr(error.message);
    setNewSub(""); load();
  }
  if(!d) return html`<div class="page"><${Note} kind="bad">${err}<//><${Empty}>Loading...<//></div>`;

  const mine = id => d.assigns.filter(a=>a.teacher_id===id);
  const person = t => html`<button class="item" key=${t.id} onClick=${()=>setSel(t)}>
    <${Av} p=${t} size=${42} tint=${true} />
    <span><span class="t">${fullName(t)}</span>${t.staff_id ? html`<br/><span class="small muted">Staff ID ${t.staff_id}</span>` : null}</span>
    <span class="count small" style="font-size:.9rem">View profile</span></button>`;

  if(sel) return html`<${TeacherProfile} t=${sel} d=${d} isOwner=${isOwner} reload=${load} back=${()=>setSel(null)} />`;

  const ql = q.trim().toLowerCase();
  const filtered = d.teachers.filter(t => !ql || fullName(t).toLowerCase().includes(ql) ||
    mine(t.id).some(a => (a.subjects && a.subjects.name.toLowerCase().includes(ql)) || (a.classes && a.classes.name.toLowerCase().includes(ql))));

  let browse = null;
  if(tab==="subject"){
    if(!sub){
      browse = d.subjects.length ? d.subjects.map(s=>html`<button class="item" key=${s.id} onClick=${()=>setSub(s)}><span class="t">${s.name}</span></button>`) : html`<${Empty}>No subjects yet.<//>`;
    } else if(!cls){
      const ids = [...new Set(d.assigns.filter(a=>a.subject_id===sub.id).map(a=>a.class_id))];
      const cl = d.classes.filter(c=>ids.includes(c.id));
      browse = html`<button class="link" onClick=${()=>setSub(null)}>Change subject</button><h3>${sub.name}: choose a class</h3>
        ${cl.length ? cl.map(c=>html`<button class="item" key=${c.id} onClick=${()=>setCls(c)}><span class="t">${c.name}</span></button>`) : html`<${Empty}>No class has this subject yet.<//>`}`;
    } else {
      const tids = new Set(d.assigns.filter(a=>a.subject_id===sub.id && a.class_id===cls.id).map(a=>a.teacher_id));
      const tl = d.teachers.filter(t=>tids.has(t.id));
      browse = html`<button class="link" onClick=${()=>setCls(null)}>Change class</button><h3>${sub.name} · ${cls.name}</h3>
        ${tl.length ? tl.map(person) : html`<${Empty}>No teacher assigned.<//>`}`;
    }
  }

  return html`<div class="page">
    <h2>Teachers</h2>
    <${Note} kind="bad">${err}<//>
    <div class="tabs">
      <button class=${tab==="all"?"on":""} onClick=${()=>setTab("all")}>All teachers</button>
      <button class=${tab==="subject"?"on":""} onClick=${()=>{setTab("subject");setSub(null);setCls(null);}}>Find by subject</button>
    </div>
    ${tab==="all" ? html`<input class="inp" type="search" placeholder="Search name, subject or class" value=${q} onInput=${e=>setQ(e.target.value)} />
      ${filtered.length ? filtered.map(person) : html`<${Empty}>No teachers found.<//>`}` : browse}
    ${isOwner ? html`<form class="panel" onSubmit=${addSubject}>
      <h3>Add a subject</h3>
      <div class="row"><input class="inp grow" required placeholder="e.g. Mathematics" value=${newSub} onInput=${e=>setNewSub(e.target.value)} /><button class="btn sm">Add</button></div>
    </form>` : null}
  </div>`;
}

function TeacherProfile({t,d,isOwner,reload,back}){
  const [cid,setCid] = useState(""); const [sid,setSid] = useState(""); const [ct,setCt] = useState(false); const [err,setErr] = useState("");
  const rows = d.assigns.filter(a=>a.teacher_id===t.id);
  const byClass = {}; rows.forEach(a=>{const k=a.classes?a.classes.name:"Class";(byClass[k]=byClass[k]||[]).push(a);});

  async function assign(e){
    e.preventDefault(); setErr("");
    const {error} = await sb.from("teaching_assignments").insert({teacher_id:t.id,class_id:cid,subject_id:sid,is_class_teacher:ct});
    if(error) return setErr(error.message.includes("duplicate") ? "Already assigned." : error.message);
    reload();
  }
  async function remove(id){ await sb.from("teaching_assignments").delete().eq("id",id); reload(); }

  return html`<div class="page">
    <button class="link" onClick=${back}>Back to teachers</button>
    <div class="panel"><div class="row"><${Av} p=${t} size=${56} tint=${true} />
      <div><h2>${fullName(t)}</h2>${t.staff_id ? html`<span class="small muted">Staff ID ${t.staff_id}</span>` : null}</div></div></div>
    <div class="panel"><h3>Subjects and classes</h3>
      ${rows.length===0 ? html`<span class="muted">Not assigned to any class yet.</span>` :
        Object.keys(byClass).map(k=>html`<div key=${k}><b>${k}</b>${byClass[k].map(a=>html`<div class="row" key=${a.id}>
          <span class="grow">${a.subjects ? a.subjects.name : "Subject"}${a.is_class_teacher ? " (class teacher)" : ""}</span>
          ${isOwner ? html`<button class="link small" onClick=${()=>remove(a.id)}>Remove</button>` : null}</div>`)}</div>`)}
    </div>
    ${isOwner ? html`<form class="panel" onSubmit=${assign}><h3>Assign to a class and subject</h3>
      <${Note} kind="bad">${err}<//>
      <${Field} label="Class"><select required value=${cid} onChange=${e=>setCid(e.target.value)}><option value="">Choose class</option>${d.classes.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select><//>
      <${Field} label="Subject"><select required value=${sid} onChange=${e=>setSid(e.target.value)}><option value="">Choose subject</option>${d.subjects.map(s=>html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select><//>
      <label class="row"><input type="checkbox" checked=${ct} onChange=${e=>setCt(e.target.checked)} /> Class teacher for this class</label>
      <button class="btn">Assign</button></form>` : null}
  </div>`;
}

/* ---------------- ATTENDANCE ---------------- */
const todayStr = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const STATUS = [["present","Present","P"],["absent","Absent","A"],["late","Late","L"],["excused","Excused","E"]];

function Attendance({profile,isOwner,role}){
  const [classes,setClasses] = useState(null); const [cid,setCid] = useState("");
  const [tab,setTab] = useState("take"); const [err,setErr] = useState("");
  useEffect(()=>{
    (async()=>{
      if(role === "teacher"){
        const [d,ct] = await Promise.all([
          sb.from("teaching_assignments").select("class_id, classes(id,name,level)").eq("teacher_id",profile.id),
          sb.from("class_teachers").select("class_id, classes(id,name,level)").eq("teacher_id",profile.id)
        ]);
        if(d.error) return setErr(d.error.message);
        const m = {}; (d.data||[]).concat(ct.data||[]).forEach(a=>{ if(a.classes) m[a.classes.id] = a.classes; });
        setClasses(Object.values(m).sort((a,b)=>a.level-b.level || a.name.localeCompare(b.name)));
      } else {
        const {data,error} = await sb.from("classes").select("id,name,level").order("level").order("name");
        if(error) return setErr(error.message);
        setClasses(data||[]);
      }
    })();
  },[role,profile.id]);
  const cls = (classes||[]).find(c=>c.id===cid);
  const canEdit = isOwner || role === "teacher";
  return html`<div class="page"><h2>Attendance</h2>
    <${Note} kind="bad">${err}<//>
    ${classes===null ? html`<${Empty}>Loading...<//>` : classes.length===0 ? html`<${Empty}>${role==="teacher" ? "You have not joined a class yet. Open My classes in the menu and enter your class token." : "No classes yet."}<//>` : html`
      <${Field} label="Class"><select value=${cid} onChange=${e=>setCid(e.target.value)}>
        <option value="">Choose a class</option>${classes.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select><//>
      ${cls ? html`<div class="tabs">
          <button class=${tab==="take"?"on":""} onClick=${()=>setTab("take")}>${canEdit ? "Take attendance" : "View day"}</button>
          <button class=${tab==="history"?"on":""} onClick=${()=>setTab("history")}>History</button></div>
        ${tab==="take" ? html`<${TakeAttendance} key=${cls.id} cls=${cls} profile=${profile} canEdit=${canEdit} />` : html`<${AttendanceHistory} key=${cls.id} cls=${cls} />`}` : null}`}
  </div>`;
}

function TakeAttendance({cls,profile,canEdit}){
  const [date,setDate] = useState(todayStr()); const [session,setSession] = useState("morning");
  const [students,setStudents] = useState(null); const [marks,setMarks] = useState({});
  const [existing,setExisting] = useState(false); const [busy,setBusy] = useState(false); const [msg,setMsg] = useState(null);

  const load = useCallback(async()=>{
    setStudents(null); setMsg(null);
    const [st,at] = await Promise.all([
      sb.from("students").select(STUDENT_COLS).eq("class_id",cls.id).eq("enrollment_status","active").order("surname"),
      sb.from("attendance").select("student_id,status").eq("class_id",cls.id).eq("att_date",date).eq("session",session)
    ]);
    if(st.error) return setMsg({kind:"bad",text:st.error.message});
    const m = {}; (at.data||[]).forEach(r=>{ m[r.student_id] = r.status; });
    setMarks(m); setExisting((at.data||[]).length > 0); setStudents(st.data);
  },[cls.id,date,session]);
  useEffect(()=>{load();},[load]);

  const all = students || [];
  const marked = all.filter(s=>marks[s.id]).length;
  const count = k => all.filter(s=>marks[s.id]===k).length;
  const setOne = (id,k) => setMarks({...marks,[id]:k});
  const markAll = () => { const m = {}; all.forEach(s=>{ m[s.id] = "present"; }); setMarks(m); };

  async function save(){
    if(marked < all.length) return setMsg({kind:"bad",text:"Mark every student before saving. "+(all.length-marked)+" still to mark."});
    setBusy(true); setMsg(null);
    const now = new Date().toISOString();
    const rows = all.map(s=>({student_id:s.id,class_id:cls.id,att_date:date,session:session,status:marks[s.id],marked_by:profile.id,updated_at:now}));
    const {error} = await sb.from("attendance").upsert(rows,{onConflict:"student_id,class_id,att_date,session"});
    setBusy(false);
    if(error) return setMsg({kind:"bad",text:error.message});
    setExisting(true); setMsg({kind:"good",text:"Saved. "+cls.name+" attendance for "+date+" ("+session+") is recorded."});
  }

  return html`<div class="stack" style="max-width:none">
    <div class="grid2">
      <${Field} label="Date"><input type="date" max=${todayStr()} value=${date} onChange=${e=>setDate(e.target.value || todayStr())} /><//>
      <${Field} label="Session"><select value=${session} onChange=${e=>setSession(e.target.value)}><option value="morning">Morning</option><option value="afternoon">Afternoon</option></select><//>
    </div>
    ${existing ? html`<${Note}>${canEdit ? "Attendance is already recorded for this session. Saving again will correct it." : "Attendance recorded for this session."}<//>` : (!canEdit && students!==null ? html`<${Note}>Nothing recorded for this session yet.<//>` : null)}
    ${students===null ? html`<${Empty}>Loading...<//>` : all.length===0 ? html`<${Empty}>No active students in ${cls.name}.<//>` : html`

function AttendanceHistory({cls}){
  const [month,setMonth] = useState(todayStr().slice(0,7));
  const [data,setData] = useState(null); const [err,setErr] = useState("");
  useEffect(()=>{
    let dead = false;
    (async()=>{
      setData(null); setErr("");
      const y = Number(month.slice(0,4)), m = Number(month.slice(5,7));
      const start = month + "-01";
      const next = m === 12 ? (y+1)+"-01-01" : y+"-"+String(m+1).padStart(2,"0")+"-01";
      const st = await sb.from("students").select(STUDENT_COLS).eq("class_id",cls.id).order("surname");
      if(st.error){ if(!dead) setErr(st.error.message); return; }
      let rows = [], from = 0;
      for(;;){
        const r = await sb.from("attendance").select("student_id,att_date,session,status").eq("class_id",cls.id).gte("att_date",start).lt("att_date",next).range(from,from+999);
        if(r.error){ if(!dead) setErr(r.error.message); return; }
        rows = rows.concat(r.data);
        if(r.data.length < 1000) break;
        from += 1000;
      }
      if(!dead) setData({students:st.data,rows:rows});
    })();
    return ()=>{ dead = true; };
  },[month,cls.id]);

  let body = html`<${Empty}>Loading...<//>`;
  if(data){
    const per = {}; data.students.forEach(s=>{ per[s.id] = {present:0,absent:0,late:0,excused:0}; });
    const days = {};
    data.rows.forEach(r=>{
      if(per[r.student_id]) per[r.student_id][r.status]++;
      const d = days[r.att_date] = days[r.att_date] || {present:0,absent:0,late:0,excused:0};
      d[r.status]++;
    });
    const dayKeys = Object.keys(days).sort().reverse();
    body = data.rows.length === 0 ? html`<${Empty}>No attendance recorded in this month.<//>` : html`
      <div class="panel"><h3>Monthly summary</h3>
        <table class="tbl"><thead><tr><th>Student</th><th>P</th><th>A</th><th>L</th><th>E</th></tr></thead>
        <tbody>${data.students.map(s=>html`<tr key=${s.id}><td>${fullName(s)}</td><td>${per[s.id].present}</td><td>${per[s.id].absent}</td><td>${per[s.id].late}</td><td>${per[s.id].excused}</td></tr>`)}</tbody></table>
        <div class="small muted">P present, A absent, L late, E excused (counted per session)</div>
      </div>
      <div class="panel"><h3>Daily totals</h3>
        ${dayKeys.map(k=>html`<div key=${k} class="row"><b class="grow">${k}</b><span class="small">${days[k].present} present, ${days[k].absent} absent, ${days[k].late} late, ${days[k].excused} excused</span></div>`)}
      </div>`;
  }
  return html`<div class="stack" style="max-width:none">
    <${Field} label="Month"><input type="month" max=${todayStr().slice(0,7)} value=${month} onChange=${e=>setMonth(e.target.value || todayStr().slice(0,7))} /><//>
    <${Note} kind="bad">${err}<//>
    ${body}
  </div>`;
}

/* ----- student ----- */
function SubmitBox({a,studentId,sub,enabled,reload}){
  const [text,setText] = useState(""); const [link,setLink] = useState("");
  const [busy,setBusy] = useState(false); const [msg,setMsg] = useState(null);
  if(sub){
    const late = a.due_date && new Date(sub.submitted_at) > new Date(a.due_date);
    return html`<div class="note good">Submitted ${when(sub.submitted_at)}${late ? " (late)" : ""}${sub.marks!==null && sub.marks!==undefined ? " \u00B7 Marks: "+sub.marks+(a.max_marks ? "/"+a.max_marks : "") : ""}${sub.feedback ? " \u00B7 Feedback: "+sub.feedback : ""}</div>`;
  }
  if(!enabled) return null;
  async function submit(e){
    e.preventDefault(); setMsg(null);
    if(!text.trim() && !link.trim()) return setMsg({kind:"bad",text:"Write your answer or add a link."});
    if(link.trim() && !safeUrl(link)) return setMsg({kind:"bad",text:"The link must start with http:// or https://"});
    setBusy(true);
    const {error} = await sb.from("assignment_submissions").insert({assignment_id:a.id,student_id:studentId,answer_text:text.trim()||null,file_url:safeUrl(link)});
    setBusy(false);
    if(error) return setMsg({kind:"bad",text:error.message});
    reload();
  }
  return html`<form class="stack" style="max-width:none" onSubmit=${submit}>
    <${Field} label="Your answer"><textarea value=${text} onInput=${e=>setText(e.target.value)}></textarea><//>
    <${Field} label="Link to your work (optional)"><input value=${link} onInput=${e=>setLink(e.target.value)} placeholder="https://" /><//>
    <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
    <button class="btn sm" style="align-self:flex-start" disabled=${busy}>${busy ? "Submitting..." : "Submit assignment"}</button>
    <div class="small muted">You can only submit once, so check your work first.</div>
  </form>`;
}

function StudentAssignments({profile}){
  const [me,setMe] = useState(undefined); const [list,setList] = useState(null);
  const [subs,setSubs] = useState({}); const [names,setNames] = useState({});
  const [enabled,setEnabled] = useState(true); const [subj,setSubj] = useState(""); const [err,setErr] = useState("");

  const load = useCallback(async()=>{
    const m = await sb.from("students").select("id,class_id,classes(name)").eq("profile_id",profile.id).maybeSingle();
    if(m.error) return setErr(m.error.message);
    if(!m.data){ setMe(null); return; }
    setMe(m.data);
    const [a,st] = await Promise.all([
      sb.from("assignments").select("*, subjects(name)").eq("class_id",m.data.class_id).order("created_at",{ascending:false}),
      sb.from("school_settings").select("assignment_submission_enabled").maybeSingle()
    ]);
    if(a.error) return setErr(a.error.message);
    const sm = {};
    if(a.data.length){
      const r = await sb.from("assignment_submissions").select("*").eq("student_id",m.data.id).in("assignment_id",a.data.map(x=>x.id));
      (r.data||[]).forEach(x=>{ sm[x.assignment_id] = x; });
    }
    setNames(await loadNames(a.data.map(x=>x.teacher_id)));
    setSubs(sm); setEnabled(st.data ? st.data.assignment_submission_enabled !== false : true); setList(a.data);
  },[profile.id]);
  useEffect(()=>{load();},[load]);

  if(me === null) return html`<div class="page"><h2>Assignments</h2><${Empty}>Your account is not linked to a student record yet. Please ask the school office.<//></div>`;
  const subjects = [...new Set((list||[]).map(a=>a.subjects ? a.subjects.name : "").filter(Boolean))].sort();
  const shown = (list||[]).filter(a => !subj || (a.subjects && a.subjects.name === subj));
  return html`<div class="page"><h2>Assignments</h2>
    ${me && me.classes ? html`<div class="muted">${me.classes.name}</div>` : null}
    <${Note} kind="bad">${err}<//>
    ${subjects.length > 1 ? html`<select class="inp" value=${subj} onChange=${e=>setSubj(e.target.value)} aria-label="Filter by subject"><option value="">All subjects</option>${subjects.map(x=>html`<option key=${x} value=${x}>${x}</option>`)}</select>` : null}
    ${list===null ? html`<${Empty}>Loading...<//>` : shown.length===0 ? html`<${Empty}>No assignments yet.<//>` :
      shown.map(a=>html`<article class="panel" key=${a.id}>
        <h3>${a.title}</h3>
        <${AsgBody} a=${a} names=${names} />
        <${SubmitBox} a=${a} studentId=${me.id} sub=${subs[a.id]} enabled=${enabled} reload=${load} />
      </article>`)}
  </div>`;
}

function ParentAssignments({profile}){
  const [classes,setClasses] = useState(null); const [unlocked,setUnlocked] = useState({});
  const [sel,setSel] = useState(null); const [tok,setTok] = useState(""); const [msg,setMsg] = useState(null);
  const [list,setList] = useState(null); const [names,setNames] = useState({}); const [busy,setBusy] = useState(false);

  useEffect(()=>{
    (async()=>{
      const since = new Date(Date.now() - 12*3600*1000).toISOString();
      const [c,t] = await Promise.all([
        sb.from("classes").select("id,name,level").order("level").order("name"),
        sb.from("token_attempts").select("class_id").eq("user_id",profile.id).eq("ok",true).gte("at",since)
      ]);
      const u = {}; (t.data||[]).forEach(r=>{ u[r.class_id] = true; });
      setUnlocked(u); setClasses(c.data||[]);
    })();
  },[profile.id]);

  async function openClass(c, isOpen){
    setSel(c); setMsg(null); setTok(""); setList(null);
    if(isOpen) loadList(c);
  }
  async function loadList(c){
    const a = await sb.from("assignments").select("*, subjects(name)").eq("class_id",c.id).order("created_at",{ascending:false});
    if(a.error) return setMsg({kind:"bad",text:a.error.message});
    setNames(await loadNames(a.data.map(x=>x.teacher_id)));
    setList(a.data);
  }
  async function verify(e){
    e.preventDefault(); setMsg(null); setBusy(true);
    const {data,error} = await sb.rpc("verify_class_token",{cid:sel.id,tok:tok.trim()});
    setBusy(false);
    if(error) return setMsg({kind:"bad",text:error.message});
    if(!data) return setMsg({kind:"bad",text:"That token is not correct, or none of your linked children is in this class."});
    setUnlocked({...unlocked,[sel.id]:true}); loadList(sel);
  }

  if(sel){
    const isOpen = !!unlocked[sel.id];
    return html`<div class="page">
      <button class="link" onClick=${()=>setSel(null)}>Back to classes</button>
      <h2>${sel.name} assignments</h2>
      ${!isOpen ? html`<form class="panel" onSubmit=${verify}>
        <h3>Enter class token</h3>
        <span class="muted">Ask the school office for the ${sel.name} token. You need a linked child in this class.</span>
        <${Field} label="Class token"><input required value=${tok} onInput=${e=>setTok(e.target.value)} autocomplete="off" /><//>
        <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
        <button class="btn" disabled=${busy}>${busy ? "Checking..." : "Unlock assignments"}</button>
      </form>` : html`
        <${Note} kind="bad">${msg && msg.text}<//>
        ${list===null ? html`<${Empty}>Loading...<//>` : list.length===0 ? html`<${Empty}>No assignments yet.<//>` :
          list.map(a=>html`<article class="panel" key=${a.id}><h3>${a.title}</h3><${AsgBody} a=${a} names=${names} /></article>`)}`}
    </div>`;
  }
  return html`<div class="page"><h2>Assignments</h2>
    <span class="muted">Choose your child's class, then enter its token.</span>
    ${classes===null ? html`<${Empty}>Loading...<//>` : classes.map(c=>html`<button class="item" key=${c.id} onClick=${()=>openClass(c,!!unlocked[c.id])}>
      <span class="t">${c.name}</span><span class="count small" style="font-size:.9rem">${unlocked[c.id] ? "Unlocked" : "Enter token"}</span></button>`)}
  </div>`;
}

    const {error} = await sb.from("assignment_submissions").update({marks:n,feedback:fb.trim()||null}).eq("id",sub.id);
    if(error) return setMsg({kind:"bad",text:error.message});

          <${Field} label="Feedback"><input value=${fb} onInput=${e=>setFb(e.target.value)} /><//>

        <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>

function Submissions({a,canGrade}){

function PostAssignment({profile,isOwner,done}){
  const [opts,setOpts] = useState(null);
  const [f,setF] = useState({cid:"",sid:"",title:"",instr:"",due:"",marks:"",link:""});
  const [busy,setBusy] = useState(false); const [msg,setMsg] = useState(null);
  useEffect(()=>{
    (async()=>{
      if(isOwner){
        const [c,sj] = await Promise.all([
          sb.from("classes").select("id,name,level").order("level").order("name"),
          sb.from("subjects").select("id,name").order("name")
        ]);
        setOpts({classes:c.data||[],pairs:null,subjects:sj.data||[]});
      } else {
        const {data,error} = await sb.from("teaching_assignments").select("class_id,subject_id, classes(id,name,level), subjects(id,name)").eq("teacher_id",profile.id);
        if(error) return setMsg({kind:"bad",text:error.message});
        const cm = {}; (data||[]).forEach(x=>{ if(x.classes) cm[x.classes.id] = x.classes; });
        setOpts({classes:Object.values(cm).sort((p,q)=>p.level-q.level || p.name.localeCompare(q.name)),pairs:data||[],subjects:[]});
      }
    })();
  },[isOwner,profile.id]);
  if(!opts) return html`<${Empty}>Loading...<//>`;
  if(opts.classes.length===0) return html`<${Empty}>You are not assigned to any class yet. Ask the proprietor to assign you to a class and subject.<//>`;
  const subjectOpts = isOwner ? opts.subjects : (opts.pairs||[]).filter(p=>p.class_id===f.cid).map(p=>p.subjects).filter(Boolean);
  const set = k => e => setF({...f,[k]:e.target.value});

  async function submit(e){
    e.preventDefault(); setMsg(null);
    if(f.link.trim() && !safeUrl(f.link)) return setMsg({kind:"bad",text:"The link must start with http:// or https://"});

    setBusy(true);
    const {error} = await sb.from("assignments").insert({
      title:f.title.trim(), class_id:f.cid, subject_id:f.sid, instructions:f.instr.trim()||null,

      max_marks:f.marks !== "" ? Math.round(Number(f.marks)) : null, attachment_url:safeUrl(f.link)
    });
    setBusy(false);
    if(error) return setMsg({kind:"bad",text:error.message});
    done();
  }
  return html`<form class="panel" onSubmit=${submit}><h3>New assignment</h3>
    <${Field} label="Class"><select required value=${f.cid} onChange=${e=>setF({...f,cid:e.target.value,sid:""})}>
      <option value="">Choose class</option>${opts.classes.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select><//>
    <${Field} label="Subject"><select required value=${f.sid} onChange=${set("sid")}>
      <option value="">Choose subject</option>${subjectOpts.map(x=>html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select><//>
    <${Field} label="Title"><input required maxlength="120" value=${f.title} onInput=${set("title")} /><//>
    <${Field} label="Instructions"><textarea value=${f.instr} onInput=${set("instr")}></textarea><//>
    <div class="grid2">
      <${Field} label="Due date and time"><input type="datetime-local" value=${f.due} onInput=${set("due")} /><//>
      <${Field} label="Total marks (optional)"><input type="number" min="1" value=${f.marks} onInput=${set("marks")} /><//>
    </div>
    <${Field} label="Link to attachment (optional)"><input value=${f.link} onInput=${set("link")} placeholder="https://" /><//>
    <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
    <button class="btn" disabled=${busy}>${busy ? "Posting..." : "Post assignment"}</button>
  </form>`;
}

      sb.from("classes").select("id,name,level").order("level").order("name")

    setList(a.data); setClasses(c.data||[]);
  },[]);
  useEffect(()=>{load();},[load]);
  async function remove(id){
    if(!confirm("Delete this assignment and its submissions?")) return;
    const {error} = await sb.from("assignments").delete().eq("id",id);
    if(error) setErr(error.message); else load();
  }
  const shown = (list||[]).filter(a => !cf || a.class_id === cf);
  return html`<div class="page"><h2>Assignments</h2>
    ${(canPost || isOwner) ? html`<div class="tabs">
      <button class=${tab==="list"?"on":""} onClick=${()=>setTab("list")}>All</button>
      ${canPost ? html`<button class=${tab==="post"?"on":""} onClick=${()=>setTab("post")}>Post new</button>` : null}
      ${isOwner ? html`<button class=${tab==="tokens"?"on":""} onClick=${()=>setTab("tokens")}>Tokens</button>` : null}
    </div>` : null}
    <${Note} kind="bad">${err}<//>
    ${tab==="post" ? html`<${PostAssignment} profile=${profile} isOwner=${isOwner} done=${()=>{ setTab("list"); load(); }} />` :
      tab==="tokens" ? html`<${TokensPanel} />` : html`
      <select class="inp" value=${cf} onChange=${e=>setCf(e.target.value)} aria-label="Filter by class"><option value="">All classes</option>${classes.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select>
      ${list===null ? html`<${Empty}>Loading...<//>` : shown.length===0 ? html`<${Empty}>No assignments yet.<//>` :
        shown.map(a=>html`<article class="panel" key=${a.id}>
          <h3>${a.title}</h3>
          <${AsgBody} a=${a} names=${names} />
          <div class="row">
            <button class="link" onClick=${()=>setOpen({...open,[a.id]:!open[a.id]})}>${open[a.id] ? "Hide submissions" : "View submissions"}</button>
            ${(isOwner || a.teacher_id===profile.id) ? html`<button class="link" onClick=${()=>remove(a.id)}>Delete</button>` : null}
          </div>
          ${open[a.id] ? html`<${Submissions} a=${a} canGrade=${a.teacher_id===profile.id} />` : null}
        </article>`)}`}
  </div>`;
}
