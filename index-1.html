<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A24">
<title>Smart School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F2A24;--green:#14594B;--mint:#E3F0EB;--paper:#F4F7F6;--line:#D5E0DC;--text:#1A2B27;--muted:#5B6E68;--chalk:#F5B700;--bad:#B3261E;--good:#17683A;--margin:#D9534F}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Public Sans",system-ui,sans-serif;background:var(--paper);color:var(--text);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif;margin:0;letter-spacing:-.01em;line-height:1.15}
h2{font-size:1.4rem}h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.875rem}
.center{text-align:center}

/* exercise-book welcome */
.book{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:32px 22px 32px 66px;position:relative;
 background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#cfe2dc 31px,#cfe2dc 32px),#FBFDFC}
.book::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.crest{width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:700;font-size:1.6rem;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:cover}
.book h1{font-size:2.2rem}
.motto{margin:0;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px;max-width:420px}

/* controls */
.btn{border:0;border-radius:10px;padding:13px 18px;background:var(--green);color:#fff;font-weight:600;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.55;cursor:default}
.btn.alt{background:#fff;color:var(--green);border:2px solid var(--green)}
.btn.chalk{background:var(--chalk);color:var(--ink)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.9rem;border-radius:8px}
.link{background:none;border:0;color:var(--green);font-weight:600;text-decoration:underline;cursor:pointer;padding:8px 0}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:500}
.field input,.field select,.field textarea,.inp{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:#fff;min-height:48px;width:100%;font-weight:400}
.field textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.note{padding:10px 12px;border-radius:10px;background:var(--mint);font-size:.92rem}
.note.bad{background:#FBE6E4;color:#7A1B14}
.note.good{background:#DCF1E3;color:#0F4D29}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.top h3{flex:1;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;color:#fff;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.burger{width:22px;height:16px;position:relative}
.burger i{position:absolute;left:0;right:0;height:2.5px;background:#fff;border-radius:2px}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:6.5px}.burger i:nth-child(3){bottom:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--chalk);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:#fff;z-index:40;display:flex;flex-direction:column;box-shadow:6px 0 24px rgba(0,0,0,.2);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer header{padding:20px 18px;background:var(--ink);color:#fff}
.drawer nav{display:flex;flex-direction:column;padding:8px}
.drawer nav button{text-align:left;background:none;border:0;padding:14px 12px;border-radius:10px;font-weight:500;cursor:pointer}
.drawer nav button.on{background:var(--mint);color:var(--green);font-weight:600}
.drawer footer{margin-top:auto;padding:14px}
.page{max-width:760px;margin:0 auto;padding:16px 14px 60px;display:flex;flex-direction:column;gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;cursor:pointer}
.item:hover{border-color:var(--green)}
.item .t{font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--mint);color:var(--green);font-size:.78rem;font-weight:600}
.badge.warn{background:#FFF1C2;color:#6B5200}
.count{margin-left:auto;font-family:"Bricolage Grotesque";font-weight:700;font-size:1.3rem;color:var(--green)}
.post-title{font-size:1.15rem}
.comment{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React,{useState,useEffect,useCallback} from "https://esm.sh/react@18.3.1";
import {createRoot} from "https://esm.sh/react-dom@18.3.1/client";
import htm from "https://esm.sh/htm@3.1.1";
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

const html = htm.bind(React.createElement);
const sb = createClient(
  "https://mdvhelcnsmxoxsxtbbxi.supabase.co",
  "sb_publishable__BK3bkWYwQOPTp2NINf1-g_bk8OMGyv"
);

const ROLE = {proprietor:"Proprietor",vice_principal:"Vice Principal",teacher:"Teacher",parent:"Parent",student:"Student",admin:"Administrator",pending:"Awaiting approval"};
const STUDENT_COLS = "id,admission_no,first_name,middle_name,surname,class_id,enrollment_status,profile_id";
const fullName = p => [p && p.first_name, p && p.middle_name, p && p.surname].filter(Boolean).join(" ");
const when = d => new Date(d).toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"});
const initials = p => ((p && p.first_name || "?")[0] + (p && p.surname || "")[0]).toUpperCase();

const Field = ({label,children}) => html`<label class="field"><span>${label}</span>${children}</label>`;
const Note = ({kind,children}) => children ? html`<div class=${"note "+(kind||"")} role="status">${children}</div>` : null;
const Empty = ({children}) => html`<div class="empty">${children}</div>`;

/* ---------------- AUTH ---------------- */
function Crest({school}){
  return html`<div class="crest" aria-hidden="true">${school && school.logo_url ? html`<img src=${school.logo_url} alt="" />` : ((school && school.name || "S")[0])}</div>`;
}

function Auth({school}){
  const [mode,setMode] = useState("welcome");
  const [f,setF] = useState({first:"",middle:"",surname:"",dob:"",phone:"",email:"",password:"",role:"student"});
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState(null);
  const set = k => e => setF({...f,[k]:e.target.value});
  const go = m => { setMsg(null); setMode(m); };

  async function login(e){
    e.preventDefault(); setBusy(true); setMsg(null);
    const {error} = await sb.auth.signInWithPassword({email:f.email.trim(),password:f.password});
    setBusy(false);
    if(error) setMsg({kind:"bad",text:error.message});
  }
  async function signup(e){
    e.preventDefault(); setMsg(null);
    if(!f.first.trim() || !f.surname.trim()) return setMsg({kind:"bad",text:"Enter your first name and surname."});
    if(f.password.length < 8) return setMsg({kind:"bad",text:"Use a password of at least 8 characters."});
    setBusy(true);
    const {data,error} = await sb.auth.signUp({
      email:f.email.trim(), password:f.password,
      options:{data:{first_name:f.first.trim(),middle_name:f.middle.trim(),surname:f.surname.trim(),date_of_birth:f.dob,phone:f.phone.trim(),requested_role:f.role}}
    });
    setBusy(false);
    if(error) return setMsg({kind:"bad",text:error.message});
    if(!data.session) setMsg({kind:"good",text:"Account created. Check your email to confirm it, then log in."});
  }
  async function forgot(e){
    e.preventDefault(); setBusy(true); setMsg(null);
    const {error} = await sb.auth.resetPasswordForEmail(f.email.trim(),{redirectTo:location.origin+location.pathname});
    setBusy(false);
    setMsg(error ? {kind:"bad",text:error.message} : {kind:"good",text:"If that email has an account, a reset link is on its way."});
  }
  async function google(){
    const {error} = await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
    if(error) setMsg({kind:"bad",text:error.message});
  }

  const head = html`<${Crest} school=${school} /><h1>${school ? school.name : "Smart School"}</h1>${school && school.motto ? html`<p class="motto">${school.motto}</p>` : null}`;

  if(mode==="welcome") return html`<main class="book">
    ${head}
    <p>Welcome. Sign in to see announcements, classes, results and more.</p>
    <div class="stack">
      <button class="btn" onClick=${()=>go("signup")}>Sign up</button>
      <button class="btn alt" onClick=${()=>go("login")}>Log in</button>
      <button class="btn alt" onClick=${google}>Continue with Google</button>
      <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
    </div>
  </main>`;

  if(mode==="login") return html`<main class="book">
    ${head}
    <form class="stack" onSubmit=${login}>
      <${Field} label="Email"><input type="email" required autocomplete="email" value=${f.email} onInput=${set("email")} /><//>
      <${Field} label="Password"><input type="password" required autocomplete="current-password" value=${f.password} onInput=${set("password")} /><//>
      <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
      <button class="btn" disabled=${busy}>${busy ? "Logging in..." : "Log in"}</button>
      <button type="button" class="link" onClick=${()=>go("forgot")}>Forgot password?</button>
      <button type="button" class="link" onClick=${()=>go("welcome")}>Back</button>
    </form>
  </main>`;

  if(mode==="forgot") return html`<main class="book">
    ${head}
    <form class="stack" onSubmit=${forgot}>
      <p class="muted">Enter your email and we will send a link to set a new password.</p>
      <${Field} label="Email"><input type="email" required value=${f.email} onInput=${set("email")} /><//>
      <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
      <button class="btn" disabled=${busy}>Send reset link</button>
      <button type="button" class="link" onClick=${()=>go("login")}>Back to log in</button>
    </form>
  </main>`;

  return html`<main class="book">
    ${head}
    <form class="stack" onSubmit=${signup}>
      <${Field} label="First name"><input required value=${f.first} onInput=${set("first")} autocomplete="given-name" /><//>
      <${Field} label="Middle name (if any)"><input value=${f.middle} onInput=${set("middle")} autocomplete="additional-name" /><//>
      <${Field} label="Surname"><input required value=${f.surname} onInput=${set("surname")} autocomplete="family-name" /><//>
      <${Field} label="Date of birth"><input type="date" value=${f.dob} onInput=${set("dob")} /><//>
      <${Field} label="Phone number"><input type="tel" value=${f.phone} onInput=${set("phone")} autocomplete="tel" /><//>
      <${Field} label="Email"><input type="email" required value=${f.email} onInput=${set("email")} autocomplete="email" /><//>
      <${Field} label="Password (8+ characters)"><input type="password" required minlength="8" value=${f.password} onInput=${set("password")} autocomplete="new-password" /><//>
      <${Field} label="I am a">
        <select value=${f.role} onChange=${set("role")}>
          <option value="student">Student</option>
          <option value="parent">Parent</option>
          <option value="teacher">Teacher</option>
          <option value="vice_principal">Vice Principal</option>
        </select>
      <//>
      <p class="small muted">Staff and student accounts are checked by the school before they are active. Proprietor accounts are created by the school owner only.</p>
      <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
      <button class="btn" disabled=${busy}>${busy ? "Creating..." : "Create account"}</button>
      <button type="button" class="link" onClick=${()=>go("welcome")}>Back</button>
    </form>
  </main>`;
}

function Recovery({school,done}){
  const [pw,setPw] = useState(""); const [msg,setMsg] = useState(null);
  async function save(e){
    e.preventDefault();
    if(pw.length < 8) return setMsg({kind:"bad",text:"Use at least 8 characters."});
    const {error} = await sb.auth.updateUser({password:pw});
    if(error) setMsg({kind:"bad",text:error.message}); else done();
  }
  return html`<main class="book"><${Crest} school=${school} /><h1>Set a new password</h1>
    <form class="stack" onSubmit=${save}>
      <${Field} label="New password"><input type="password" required minlength="8" value=${pw} onInput=${e=>setPw(e.target.value)} autocomplete="new-password" /><//>
      <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
      <button class="btn">Save password</button>
    </form></main>`;
}

function Pending({profile,school}){
  const off = profile && profile.status === "deactivated";
  return html`<main class="book"><${Crest} school=${school} />
    <h1>${off ? "Account deactivated" : "Waiting for approval"}</h1>
    <p>${off ? "This account has been switched off. Please contact the school office." :
      "Thanks for registering"+(profile ? ", "+profile.first_name : "")+". The school needs to check your details before you can use the app. Come back after you have been approved."}</p>
    <div class="stack">
      <button class="btn alt" onClick=${()=>location.reload()}>Check again</button>
      <button class="btn" onClick=${()=>sb.auth.signOut()}>Log out</button>
    </div></main>`;
}

/* ---------------- HOME / ANNOUNCEMENTS ---------------- */
function Home({profile,isOwner}){
  const [items,setItems] = useState(null);
  const [cm,setCm] = useState([]);
  const [names,setNames] = useState({});
  const [err,setErr] = useState("");
  const [title,setTitle] = useState(""); const [body,setBody] = useState("");
  const [open,setOpen] = useState({}); const [draft,setDraft] = useState({});
  const canPost = isOwner || (profile.permissions && profile.permissions.publish_announcements === true);

  const load = useCallback(async()=>{
    const a = await sb.from("announcements").select("*").order("created_at",{ascending:false}).limit(30);
    if(a.error) return setErr(a.error.message);
    let comments = [];
    if(a.data.length){
      const c = await sb.from("announcement_comments").select("*").in("announcement_id",a.data.map(x=>x.id)).order("created_at");
      comments = c.data || [];
    }
    const ids = [...new Set([...a.data.map(x=>x.author_id),...comments.map(x=>x.author_id)])];
    if(ids.length){
      const n = await sb.from("people_names").select("*").in("id",ids);
      const map = {}; (n.data||[]).forEach(p=>{map[p.id]=p;}); setNames(map);
    }
    setCm(comments); setItems(a.data);
  },[]);
  useEffect(()=>{load();},[load]);

  async function post(e){
    e.preventDefault(); setErr("");
    const {error} = await sb.from("announcements").insert({title:title.trim(),body:body.trim()});
    if(error) return setErr(error.message);
    setTitle(""); setBody(""); load();
  }
  async function comment(id){
    const text = (draft[id]||"").trim(); if(!text) return;
    const {error} = await sb.from("announcement_comments").insert({announcement_id:id,body:text});
    if(error) return setErr(error.message);
    setDraft({...draft,[id]:""}); load();
  }
  async function hide(c){ await sb.from("announcement_comments").update({hidden:true}).eq("id",c.id); load(); }
  async function removePost(id){
    if(!confirm("Delete this announcement?")) return;
    const {error} = await sb.from("announcements").delete().eq("id",id);
    if(error) setErr(error.message); else load();
  }
  const who = id => names[id] ? fullName(names[id]) : "School";

  return html`<div class="page">
    <h2>Announcements</h2>
    <${Note} kind="bad">${err}<//>
    ${canPost ? html`<form class="panel" onSubmit=${post}>
      <h3>New announcement</h3>
      <${Field} label="Title"><input required maxlength="120" value=${title} onInput=${e=>setTitle(e.target.value)} /><//>
      <${Field} label="Details"><textarea required value=${body} onInput=${e=>setBody(e.target.value)}></textarea><//>
      <button class="btn">Publish</button>
    </form>` : null}
    ${items === null ? html`<${Empty}>Loading...<//>` : items.length === 0 ? html`<${Empty}>No announcements yet.<//>` :
      items.map(a => {
        const mine = cm.filter(c => c.announcement_id === a.id);
        const visible = mine.filter(c => !c.hidden);
        return html`<article class="panel" key=${a.id}>
          <h3 class="post-title">${a.title}</h3>
          <div class="small muted">${who(a.author_id)}${names[a.author_id] ? " · "+ROLE[names[a.author_id].role] : ""} · ${when(a.created_at)}</div>
          <div style="white-space:pre-wrap">${a.body}</div>
          <div class="row">
            <button class="link" onClick=${()=>setOpen({...open,[a.id]:!open[a.id]})}>${visible.length} comment${visible.length===1?"":"s"}</button>
            ${(isOwner || a.author_id===profile.id) ? html`<button class="link" onClick=${()=>removePost(a.id)}>Delete</button>` : null}
          </div>
          ${open[a.id] ? html`<div class="stack" style="max-width:none">
            ${visible.map(c => html`<div class="comment" key=${c.id}>
              <div class="small"><b>${who(c.author_id)}</b> <span class="muted">${when(c.created_at)}</span></div>
              <div>${c.body}</div>
              ${(isOwner || a.author_id===profile.id) ? html`<button class="link small" onClick=${()=>hide(c)}>Hide comment</button>` : null}
            </div>`)}
            <div class="row">
              <input class="inp grow" placeholder="Write a comment" maxlength="1000" value=${draft[a.id]||""} onInput=${e=>setDraft({...draft,[a.id]:e.target.value})} />
              <button class="btn sm" onClick=${()=>comment(a.id)}>Send</button>
            </div>
          </div>` : null}
        </article>`;
      })}
  </div>`;
}

/* ---------------- CLASSES ---------------- */
const LEVELS = [["1","JSS1"],["2","JSS2"],["3","JSS3"],["4","SS1"],["5","SS2"],["6","SS3"]];

function Classes({profile,isOwner}){
  const [list,setList] = useState(null); const [sel,setSel] = useState(null);
  const [err,setErr] = useState(""); const [name,setName] = useState(""); const [level,setLevel] = useState("1");

  const load = useCallback(async()=>{
    const {data,error} = await sb.from("class_overview").select("*").order("level").order("name");
    if(error) return setErr(error.message);
    let rows = data;
    if(profile.role === "teacher"){
      const t = await sb.from("teaching_assignments").select("class_id").eq("teacher_id",profile.id);
      const ids = new Set((t.data||[]).map(x=>x.class_id));
      rows = rows.filter(c=>ids.has(c.id));
    }
    setList(rows);
  },[profile]);
  useEffect(()=>{load();},[load]);

  async function add(e){
    e.preventDefault(); setErr("");
    const nm = name.trim().toUpperCase();
    const stream = nm.replace(/^(JSS|SS)\d/,"") || null;
    const {error} = await sb.from("classes").insert({name:nm,level:Number(level),stream});
    if(error) return setErr(error.message);
    setName(""); load();
  }

  if(sel) return html`<${ClassPage} cls=${sel} all=${list} isOwner=${isOwner} back=${()=>{setSel(null);load();}} />`;
  return html`<div class="page">
    <h2>Classes</h2>
    <${Note} kind="bad">${err}<//>
    ${list === null ? html`<${Empty}>Loading...<//>` : list.length===0 ? html`<${Empty}>No classes assigned to you yet.<//>` :
      list.map(c => html`<button class="item" key=${c.id} onClick=${()=>setSel(c)}>
        <span class="t">${c.name}</span><span class="count">${c.student_count}</span><span class="small muted">students</span>
      </button>`)}
    ${isOwner ? html`<form class="panel" onSubmit=${add}>
      <h3>Add a class or stream</h3>
      <div class="grid2">
        <${Field} label="Name (e.g. JSS1A)"><input required value=${name} onInput=${e=>setName(e.target.value)} /><//>
        <${Field} label="Level"><select value=${level} onChange=${e=>setLevel(e.target.value)}>${LEVELS.map(l=>html`<option key=${l[0]} value=${l[0]}>${l[1]}</option>`)}</select><//>
      </div>
      <button class="btn">Add class</button>
    </form>` : null}
  </div>`;
}

function ClassPage({cls,all,isOwner,back}){
  const [students,setStudents] = useState(null); const [subs,setSubs] = useState([]);
  const [tn,setTn] = useState({}); const [codes,setCodes] = useState({});
  const [q,setQ] = useState(""); const [err,setErr] = useState("");
  const [f,setF] = useState({adm:"",first:"",middle:"",surname:""});

  const load = useCallback(async()=>{
    const [st,as,tr] = await Promise.all([
      sb.from("students").select(STUDENT_COLS).eq("class_id",cls.id).order("surname"),
      sb.from("teaching_assignments").select("*, subjects(name)").eq("class_id",cls.id),
      sb.from("staff_directory").select("*")
    ]);
    if(st.error) return setErr(st.error.message);
    setStudents(st.data); setSubs(as.data||[]);
    const m = {}; (tr.data||[]).forEach(t=>{m[t.id]=t;}); setTn(m);
    if(isOwner){
      const c = await sb.rpc("get_guardian_codes",{cid:cls.id});
      const cm = {}; (c.data||[]).forEach(r=>{cm[r.id]=r.guardian_code;}); setCodes(cm);
    }
  },[cls,isOwner]);
  useEffect(()=>{load();},[load]);

  async function add(e){
    e.preventDefault(); setErr("");
    const {error} = await sb.from("students").insert({admission_no:f.adm.trim(),first_name:f.first.trim(),middle_name:f.middle.trim()||null,surname:f.surname.trim(),class_id:cls.id});
    if(error) return setErr(error.message);

  async function move(s,cid){

    if(error) setErr(error.message); else load();
  }
  async function status(s,v){

  const active = (students||[]).filter(s=>s.enrollment_status==="active");

  return html`<div class="page">

    <div class="panel"><h3>Subjects and teachers</h3>
      ${Object.keys(bySubject).length===0 ? html`<span class="muted">No subjects assigned yet.</span>` :
        Object.keys(bySubject).sort().map(k => html`<div key=${k}><b>${k}</b>: ${bySubject[k].map(a=>fullName(tn[a.teacher_id])||"Teacher").join(", ")}</div>`)}
    </div>

    <h3>Students</h3>
    <input class="inp" placeholder="Search by name or admission number" value=${q} onInput=${e=>setQ(e.target.value)} />
    ${students===null ? html`<${Empty}>Loading...<//>` : shown.length===0 ? html`<${Empty}>No students found.<//>` :
      shown.map(s => html`<div class="panel" key=${s.id}>
        <div class="row"><span class="t grow">${fullName(s)}</span>
          <span class=${"badge"+(s.enrollment_status==="active"?"":" warn")}>${s.enrollment_status}</span></div>
        <div class="small muted">Admission no. ${s.admission_no}${isOwner && codes[s.id] ? " · Parent code: "+codes[s.id] : ""}</div>
        ${isOwner ? html`<div class="row">
          <select class="inp grow" value=${cls.id} onChange=${e=>move(s,e.target.value)} aria-label="Move to class">
            ${(all||[]).map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}
          </select>
          ${s.enrollment_status==="active" ? html`<button class="btn alt sm" onClick=${()=>status(s,"deactivated")}>Deactivate</button>` : html`<button class="btn alt sm" onClick=${()=>status(s,"active")}>Reactivate</button>`}
        </div>` : null}
      </div>`)}

    ${isOwner ? html`<form class="panel" onSubmit=${add}>
      <h3>Add a student to ${cls.name}</h3>
      <${Field} label="Admission number"><input required value=${f.adm} onInput=${e=>setF({...f,adm:e.target.value})} /><//>
      <div class="grid2">
        <${Field} label="First name"><input required value=${f.first} onInput=${e=>setF({...f,first:e.target.value})} /><//>
        <${Field} label="Surname"><input required value=${f.surname} onInput=${e=>setF({...f,surname:e.target.value})} /><//>
      </div>
      <${Field} label="Middle name (if any)"><input value=${f.middle} onInput=${e=>setF({...f,middle:e.target.value})} /><//>
      <button class="btn">Add student</button>
    </form>` : null}
  </div>`;
}

/* ---------------- TEACHERS ---------------- */
function Teachers({isOwner}){
  const [d,setD] = useState(null); const [q,setQ] = useState(""); const [tab,setTab] = useState("all");
  const [sel,setSel] = useState(null); const [sub,setSub] = useState(null); const [cls,setCls] = useState(null);
  const [newSub,setNewSub] = useState(""); const [err,setErr] = useState("");

  const load = useCallback(async()=>{
    const [t,a,s,c] = await Promise.all([
      sb.from("staff_directory").select("*").order("surname"),
      sb.from("teaching_assignments").select("*, subjects(name), classes(name)"),
      sb.from("subjects").select("*").order("name"),
      sb.from("classes").select("*").order("level").order("name")
    ]);
    if(t.error) return setErr(t.error.message);
    setD({teachers:t.data,assigns:a.data||[],subjects:s.data||[],classes:c.data||[]});
  },[]);
  useEffect(()=>{load();},[load]);

  async function addSubject(e){
    e.preventDefault(); setErr("");
    const {error} = await sb.from("subjects").insert({name:newSub.trim()});
    if(error) return setErr(error.message);
    setNewSub(""); load();
  }
  if(!d) return html`<div class="page"><${Note} kind="bad">${err}<//><${Empty}>Loading...<//></div>`;

  const mine = id => d.assigns.filter(a=>a.teacher_id===id);
  const person = t => html`<button class="item" key=${t.id} onClick=${()=>setSel(t)}>
    <span class="avatar" style="background:var(--mint);color:var(--green)">${initials(t)}</span>
    <span><span class="t">${fullName(t)}</span>${t.staff_id ? html`<br/><span class="small muted">Staff ID ${t.staff_id}</span>` : null}</span>
    <span class="count small" style="font-size:.9rem">View profile</span></button>`;

  if(sel) return html`<${TeacherProfile} t=${sel} d=${d} isOwner=${isOwner} reload=${load} back=${()=>setSel(null)} />`;

  const ql = q.trim().toLowerCase();
  const filtered = d.teachers.filter(t => !ql || fullName(t).toLowerCase().includes(ql) ||
    mine(t.id).some(a => (a.subjects && a.subjects.name.toLowerCase().includes(ql)) || (a.classes && a.classes.name.toLowerCase().includes(ql))));

  let browse = null;
  if(tab==="subject"){
    if(!sub){
      browse = d.subjects.length ? d.subjects.map(s=>html`<button class="item" key=${s.id} onClick=${()=>setSub(s)}><span class="t">${s.name}</span></button>`) : html`<${Empty}>No subjects yet.<//>`;
    } else if(!cls){
      const ids = [...new Set(d.assigns.filter(a=>a.subject_id===sub.id).map(a=>a.class_id))];
      const cl = d.classes.filter(c=>ids.includes(c.id));
      browse = html`<button class="link" onClick=${()=>setSub(null)}>Change subject</button><h3>${sub.name}: choose a class</h3>
        ${cl.length ? cl.map(c=>html`<button class="item" key=${c.id} onClick=${()=>setCls(c)}><span class="t">${c.name}</span></button>`) : html`<${Empty}>No class has this subject yet.<//>`}`;
    } else {
      const tids = new Set(d.assigns.filter(a=>a.subject_id===sub.id && a.class_id===cls.id).map(a=>a.teacher_id));
      const tl = d.teachers.filter(t=>tids.has(t.id));
      browse = html`<button class="link" onClick=${()=>setCls(null)}>Change class</button><h3>${sub.name} · ${cls.name}</h3>
        ${tl.length ? tl.map(person) : html`<${Empty}>No teacher assigned.<//>`}`;
    }
  }

  return html`<div class="page">
    <h2>Teachers</h2>
    <${Note} kind="bad">${err}<//>
    <div class="tabs">
      <button class=${tab==="all"?"on":""} onClick=${()=>setTab("all")}>All teachers</button>
      <button class=${tab==="subject"?"on":""} onClick=${()=>{setTab("subject");setSub(null);setCls(null);}}>Find by subject</button>
    </div>
    ${tab==="all" ? html`<input class="inp" type="search" placeholder="Search name, subject or class" value=${q} onInput=${e=>setQ(e.target.value)} />
      ${filtered.length ? filtered.map(person) : html`<${Empty}>No teachers found.<//>`}` : browse}
    ${isOwner ? html`<form class="panel" onSubmit=${addSubject}>
      <h3>Add a subject</h3>
      <div class="row"><input class="inp grow" required placeholder="e.g. Mathematics" value=${newSub} onInput=${e=>setNewSub(e.target.value)} /><button class="btn sm">Add</button></div>
    </form>` : null}
  </div>`;
}

function TeacherProfile({t,d,isOwner,reload,back}){
  const [cid,setCid] = useState(""); const [sid,setSid] = useState(""); const [ct,setCt] = useState(false); const [err,setErr] = useState("");
  const rows = d.assigns.filter(a=>a.teacher_id===t.id);
  const byClass = {}; rows.forEach(a=>{const k=a.classes?a.classes.name:"Class";(byClass[k]=byClass[k]||[]).push(a);});

  async function assign(e){
    e.preventDefault(); setErr("");
    const {error} = await sb.from("teaching_assignments").insert({teacher_id:t.id,class_id:cid,subject_id:sid,is_class_teacher:ct});
    if(error) return setErr(error.message.includes("duplicate") ? "Already assigned." : error.message);
    reload();
  }
  async function remove(id){ await sb.from("teaching_assignments").delete().eq("id",id); reload(); }

  return html`<div class="page">
    <button class="link" onClick=${back}>Back to teachers</button>
    <div class="panel"><div class="row"><span class="avatar" style="width:56px;height:56px;font-size:1.2rem">${initials(t)}</span>
      <div><h2>${fullName(t)}</h2>${t.staff_id ? html`<span class="small muted">Staff ID ${t.staff_id}</span>` : null}</div></div></div>
    <div class="panel"><h3>Subjects and classes</h3>
      ${rows.length===0 ? html`<span class="muted">Not assigned to any class yet.</span>` :
        Object.keys(byClass).map(k=>html`<div key=${k}><b>${k}</b>${byClass[k].map(a=>html`<div class="row" key=${a.id}>
          <span class="grow">${a.subjects ? a.subjects.name : "Subject"}${a.is_class_teacher ? " (class teacher)" : ""}</span>
          ${isOwner ? html`<button class="link small" onClick=${()=>remove(a.id)}>Remove</button>` : null}</div>`)}</div>`)}
    </div>
    ${isOwner ? html`<form class="panel" onSubmit=${assign}><h3>Assign to a class and subject</h3>
      <${Note} kind="bad">${err}<//>
      <${Field} label="Class"><select required value=${cid} onChange=${e=>setCid(e.target.value)}><option value="">Choose class</option>${d.classes.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select><//>
      <${Field} label="Subject"><select required value=${sid} onChange=${e=>setSid(e.target.value)}><option value="">Choose subject</option>${d.subjects.map(s=>html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select><//>
      <label class="row"><input type="checkbox" checked=${ct} onChange=${e=>setCt(e.target.checked)} /> Class teacher for this class</label>
      <button class="btn">Assign</button></form>` : null}
  </div>`;
}

function People({me}){
  const [rows,setRows] = useState(null); const [tab,setTab] = useState("pending"); const [err,setErr] = useState("");
  const load = useCallback(async()=>{
    const {data,error} = await sb.from("profiles").select("*").order("created_at",{ascending:false});
    if(error) setErr(error.message); else setRows(data);
  },[]);
  useEffect(()=>{load();},[load]);
  const list = (rows||[]).filter(r => tab==="pending" ? r.status==="pending" : r.status!=="pending");
  return html`<div class="page"><h2>Accounts</h2>
    <${Note} kind="bad">${err}<//>
    <div class="tabs">
      <button class=${tab==="pending"?"on":""} onClick=${()=>setTab("pending")}>Waiting (${(rows||[]).filter(r=>r.status==="pending").length})</button>
      <button class=${tab==="all"?"on":""} onClick=${()=>setTab("all")}>Everyone else</button>
    </div>
    ${rows===null ? html`<${Empty}>Loading...<//>` : list.length===0 ? html`<${Empty}>${tab==="pending" ? "Nobody is waiting for approval." : "No other accounts yet."}<//>` :
      list.map(r=>html`<${PersonCard} key=${r.id} r=${r} me=${me} done=${load} />`)}

function PersonCard({r,me,done}){
  const start = ["student","parent","teacher","vice_principal"].includes(r.requested_role) ? r.requested_role : (["student","parent","teacher","vice_principal"].includes(r.role) ? r.role : "student");
  const [role,setRole] = useState(r.status==="pending" ? start : r.role);
  const [adm,setAdm] = useState(""); const [sid,setSid] = useState(r.staff_id||""); const [e,setE] = useState("");
  const isMe = r.id === me.id;

  async function approve(){
    setE("");
    if(role==="student" && adm.trim()){
      const s = await sb.from("students").select("id,profile_id").eq("admission_no",adm.trim()).maybeSingle();
      if(!s.data) return setE("No student has that admission number. Add the student to a class first.");
      if(s.data.profile_id && s.data.profile_id !== r.id) return setE("That student is already linked to another login.");
      const u = await sb.from("students").update({profile_id:r.id}).eq("id",s.data.id);
      if(u.error) return setE(u.error.message);
    }
    const patch = {role,status:"active"};
    if((role==="teacher"||role==="vice_principal") && sid.trim()) patch.staff_id = sid.trim();
    const {error} = await sb.from("profiles").update(patch).eq("id",r.id);
    if(error) return setE(error.message.includes("duplicate") ? "That staff ID is already used." : error.message);
    done();
  }
  async function setStatus(v){ const {error} = await sb.from("profiles").update({status:v}).eq("id",r.id); if(error) setE(error.message); else done(); }
  async function perm(v){
    const {error} = await sb.from("profiles").update({permissions:{...(r.permissions||{}),publish_announcements:v}}).eq("id",r.id);
    if(error) setE(error.message); else done();
  }
  const canPerm = r.status==="active" && (r.role==="teacher"||r.role==="vice_principal");

  return html`<div class="panel">
    <div class="row"><span class="t grow">${fullName(r)}</span><span class=${"badge"+(r.status==="active"?"":" warn")}>${r.status==="pending" ? "wants: "+(ROLE[r.requested_role]||"unknown") : ROLE[r.role]+(r.status==="deactivated"?" (off)":"")}</span></div>
    <div class="small muted">${r.phone||"No phone"}${r.date_of_birth ? " · Born "+r.date_of_birth : ""}${r.staff_id ? " · Staff ID "+r.staff_id : ""}</div>
    <${Note} kind="bad">${e}<//>
    ${isMe ? html`<span class="small muted">This is you.</span>` : html`
      ${(r.status==="pending" || r.status==="deactivated") ? html`
        <${Field} label="Approve as"><select value=${role} onChange=${x=>setRole(x.target.value)}>
          <option value="student">Student</option><option value="parent">Parent</option>
          <option value="teacher">Teacher</option><option value="vice_principal">Vice Principal</option></select><//>
        ${role==="student" ? html`<${Field} label="Student admission number (links this login to the student record)"><input value=${adm} onInput=${x=>setAdm(x.target.value)} /><//>` : null}
        ${(role==="teacher"||role==="vice_principal") ? html`<${Field} label="Staff ID (optional)"><input value=${sid} onInput=${x=>setSid(x.target.value)} /><//>` : null}
        <button class="btn" onClick=${approve}>${r.status==="pending" ? "Approve account" : "Reactivate account"}</button>` : null}
      ${canPerm ? html`<label class="row"><input type="checkbox" checked=${!!(r.permissions && r.permissions.publish_announcements)} onChange=${x=>perm(x.target.checked)} /> Can publish announcements</label>` : null}
      ${r.status==="active" ? html`<button class="btn alt sm" onClick=${()=>setStatus("deactivated")}>Deactivate account</button>` : null}
      ${r.status==="pending" ? html`<button class="btn alt sm" onClick=${()=>setStatus("deactivated")}>Decline</button>` : null}`}
  </div>`;
}

/* ---------------- PROFILE ---------------- */
function Profile({profile,reload}){
  const [edit,setEdit] = useState(false);
  const [f,setF] = useState({first:profile.first_name,middle:profile.middle_name||"",surname:profile.surname,phone:profile.phone||""});
  const [msg,setMsg] = useState(null); const [kids,setKids] = useState([]); const [myClass,setMyClass] = useState("");
  const [adm,setAdm] = useState(""); const [code,setCode] = useState("");

  const loadExtra = useCallback(async()=>{
    if(profile.role==="parent"){
      const {data} = await sb.from("parent_students").select("student_id, students(first_name,middle_name,surname,admission_no,classes(name))").eq("parent_id",profile.id);
      setKids(data||[]);
    }
    if(profile.role==="student"){
      const {data} = await sb.from("students").select("classes(name)").eq("profile_id",profile.id).maybeSingle();
      setMyClass(data && data.classes ? data.classes.name : "");
    }
  },[profile]);
  useEffect(()=>{loadExtra();},[loadExtra]);

  async function save(e){
    e.preventDefault(); setMsg(null);
    const {error} = await sb.from("profiles").update({first_name:f.first.trim(),middle_name:f.middle.trim()||null,surname:f.surname.trim(),phone:f.phone.trim()||null}).eq("id",profile.id);
    if(error) return setMsg({kind:"bad",text:error.message});
    setEdit(false); reload();
  }
  async function link(e){
    e.preventDefault(); setMsg(null);
    const {data,error} = await sb.rpc("claim_child",{adm:adm.trim(),code:code.trim()});
    if(error) return setMsg({kind:"bad",text:error.message});
    if(!data) return setMsg({kind:"bad",text:"Admission number and code do not match. Ask the school office."});
    setAdm(""); setCode(""); setMsg({kind:"good",text:"Child linked."}); loadExtra();
  }

  return html`<div class="page">
    <div class="panel">
      <div class="row"><span class="avatar" style="width:64px;height:64px;font-size:1.4rem">${initials(profile)}</span>
        <div><h2>${fullName(profile)}</h2><span class="badge">${ROLE[profile.role]}</span></div></div>
      ${edit ? html`<form class="stack" style="max-width:none" onSubmit=${save}>
        <${Field} label="First name"><input required value=${f.first} onInput=${e=>setF({...f,first:e.target.value})} /><//>
        <${Field} label="Middle name"><input value=${f.middle} onInput=${e=>setF({...f,middle:e.target.value})} /><//>
        <${Field} label="Surname"><input required value=${f.surname} onInput=${e=>setF({...f,surname:e.target.value})} /><//>
        <${Field} label="Phone"><input type="tel" value=${f.phone} onInput=${e=>setF({...f,phone:e.target.value})} /><//>
        <div class="row"><button class="btn">Save changes</button><button type="button" class="btn alt" onClick=${()=>setEdit(false)}>Cancel</button></div>
      </form>` : html`
        <div>Phone: ${profile.phone || "Not set"}</div>
        ${profile.date_of_birth ? html`<div>Date of birth: ${profile.date_of_birth}</div>` : null}
        ${profile.staff_id ? html`<div>Staff ID: ${profile.staff_id}</div>` : null}
        ${myClass ? html`<div>Class: ${myClass}</div>` : null}
        <button class="btn alt sm" style="align-self:flex-start" onClick=${()=>setEdit(true)}>Edit details</button>`}
    </div>
    <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
    ${profile.role==="parent" ? html`
      <div class="panel"><h3>My children</h3>
        ${kids.length===0 ? html`<span class="muted">No child linked yet.</span>` :
          kids.map(k=>html`<div key=${k.student_id}><b>${fullName(k.students)}</b> <span class="small muted">${k.students && k.students.classes ? k.students.classes.name : ""} · ${k.students && k.students.admission_no}</span></div>`)}
      </div>
      <form class="panel" onSubmit=${link}><h3>Link a child</h3>
        <p class="small muted">Use the admission number and parent code given to you by the school office.</p>
        <${Field} label="Admission number"><input required value=${adm} onInput=${e=>setAdm(e.target.value)} /><//>
        <${Field} label="Parent code"><input required value=${code} onInput=${e=>setCode(e.target.value)} autocapitalize="off" /><//>
        <button class="btn">Link child</button></form>` : null}
    <button class="btn alt" onClick=${()=>sb.auth.signOut()}>Log out</button>
  </div>`;
}

/* ---------------- SHELL ---------------- */
function Shell({profile,school,reload}){
  const [page,setPage] = useState("home"); const [open,setOpen] = useState(false);
  const role = profile.role;
  const isOwner = role==="proprietor" || role==="admin";
  const staff = isOwner || role==="vice_principal" || role==="teacher";
  const nav = [
    ["home","Home",true],["classes","Classes",staff],["teachers","Teachers",true],
    ["people","Accounts",isOwner],["profile","Profile",true]
  ].filter(n=>n[2]);
  const go = k => { setPage(k); setOpen(false); window.scrollTo(0,0); };

  let view = null;
  if(page==="home") view = html`<${Home} profile=${profile} isOwner=${isOwner} />`;
  if(page==="classes") view = html`<${Classes} profile=${profile} isOwner=${isOwner} />`;
  if(page==="teachers") view = html`<${Teachers} isOwner=${isOwner} />`;
  if(page==="people") view = html`<${People} me=${profile} />`;
  if(page==="profile") view = html`<${Profile} profile=${profile} reload=${reload} />`;

  return html`<div>
    <header class="top">
      <button class="iconbtn" aria-label="Open menu" onClick=${()=>setOpen(true)}><span class="burger"><i></i><i></i><i></i></span></button>
      <h3>${school ? school.name : "Smart School"}</h3>
      <button class="iconbtn" aria-label="My profile" onClick=${()=>go("profile")}><span class="avatar">${initials(profile)}</span></button>
    </header>
    ${open ? html`<div class="scrim" onClick=${()=>setOpen(false)}></div>
      <aside class="drawer" aria-label="Menu">
        <header><h3>${school ? school.name : "Smart School"}</h3><div class="small" style="opacity:.8">${fullName(profile)} · ${ROLE[role]}</div></header>
        <nav>${nav.map(n=>html`<button key=${n[0]} class=${page===n[0]?"on":""} onClick=${()=>go(n[0])}>${n[1]}</button>`)}</nav>
        <footer><button class="btn alt" style="width:100%" onClick=${()=>sb.auth.signOut()}>Log out</button></footer>
      </aside>` : null}
    <main>${view}</main>
  </div>`;
}

/* ---------------- ROOT ---------------- */
function App(){
  const [session,setSession] = useState(undefined);
  const [profile,setProfile] = useState(undefined);
  const [school,setSchool] = useState(null);
  const [recovery,setRecovery] = useState(false);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const {data:sub} = sb.auth.onAuthStateChange((ev,s)=>{ if(ev==="PASSWORD_RECOVERY") setRecovery(true); setSession(s); });
    sb.from("school_settings").select("*").maybeSingle().then(({data})=>setSchool(data));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  const loadProfile = useCallback(async()=>{
    if(!session){ setProfile(undefined); return; }
    const {data} = await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
    setProfile(data || null);
  },[session]);
  useEffect(()=>{loadProfile();},[loadProfile]);

  if(session===undefined) return html`<div class="loading">Loading...</div>`;
  if(recovery && session) return html`<${Recovery} school=${school} done=${()=>setRecovery(false)} />`;
  if(!session) return html`<${Auth} school=${school} />`;
  if(profile===undefined) return html`<div class="loading">Loading...</div>`;
  if(!profile || profile.role==="pending" || profile.status!=="active") return html`<${Pending} profile=${profile} school=${school} />`;
  return html`<${Shell} profile=${profile} school=${school} reload=${loadProfile} />`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
