<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A24">
<title>Smart School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F2A24;--green:#14594B;--mint:#E3F0EB;--paper:#F4F7F6;--line:#D5E0DC;--text:#1A2B27;--muted:#5B6E68;--chalk:#F5B700;--bad:#B3261E;--good:#17683A;--margin:#D9534F}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Public Sans",system-ui,sans-serif;background:var(--paper);color:var(--text);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif;margin:0;letter-spacing:-.01em;line-height:1.15}
h2{font-size:1.4rem}h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.875rem}
.center{text-align:center}

/* exercise-book welcome */
.book{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:32px 22px 32px 66px;position:relative;
 background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#cfe2dc 31px,#cfe2dc 32px),#FBFDFC}
.book::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.crest{width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:700;font-size:1.6rem;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:cover}
.book h1{font-size:2.2rem}
.motto{margin:0;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px;max-width:420px}

/* controls */
.btn{border:0;border-radius:10px;padding:13px 18px;background:var(--green);color:#fff;font-weight:600;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.55;cursor:default}
.btn.alt{background:#fff;color:var(--green);border:2px solid var(--green)}
.btn.chalk{background:var(--chalk);color:var(--ink)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.9rem;border-radius:8px}
.link{background:none;border:0;color:var(--green);font-weight:600;text-decoration:underline;cursor:pointer;padding:8px 0}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:500}
.field input,.field select,.field textarea,.inp{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:#fff;min-height:48px;width:100%;font-weight:400}
.field textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.note{padding:10px 12px;border-radius:10px;background:var(--mint);font-size:.92rem}
.note.bad{background:#FBE6E4;color:#7A1B14}
.note.good{background:#DCF1E3;color:#0F4D29}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.top h3{flex:1;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;color:#fff;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.burger{width:22px;height:16px;position:relative}
.burger i{position:absolute;left:0;right:0;height:2.5px;background:#fff;border-radius:2px}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:6.5px}.burger i:nth-child(3){bottom:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--chalk);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:#fff;z-index:40;display:flex;flex-direction:column;box-shadow:6px 0 24px rgba(0,0,0,.2);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer header{padding:20px 18px;background:var(--ink);color:#fff}
.drawer nav{display:flex;flex-direction:column;padding:8px}
.drawer nav button{text-align:left;background:none;border:0;padding:14px 12px;border-radius:10px;font-weight:500;cursor:pointer}
.drawer nav button.on{background:var(--mint);color:var(--green);font-weight:600}
.drawer footer{margin-top:auto;padding:14px}
.page{max-width:760px;margin:0 auto;padding:16px 14px 60px;display:flex;flex-direction:column;gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;cursor:pointer}
.item:hover{border-color:var(--green)}
.item .t{font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--mint);color:var(--green);font-size:.78rem;font-weight:600}
.badge.warn{background:#FFF1C2;color:#6B5200}
.count{margin-left:auto;font-family:"Bricolage Grotesque";font-weight:700;font-size:1.3rem;color:var(--green)}
.post-title{font-size:1.15rem}
.comment{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React,{useState,useEffect,useCallback} from "https://esm.sh/react@18.3.1";
import {createRoot} from "https://esm.sh/react-dom@18.3.1/client";
import htm from "https://esm.sh/htm@3.1.1";
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

const html = htm.bind(React.createElement);
const sb = createClient(
  "https://mdvhelcnsmxoxsxtbbxi.supabase.co",
  "sb_publishable__BK3bkWYwQOPTp2NINf1-g_bk8OMGyv"
);

const ROLE = {proprietor:"Proprietor",vice_principal:"Vice Principal",teacher:"Teacher",parent:"Parent",student:"Student",admin:"Administrator",pending:"Awaiting approval"};
const STUDENT_COLS = "id,admission_no,first_name,middle_name,surname,class_id,enrollment_status,profile_id";
const fullName = p => [p && p.first_name, p && p.middle_name, p && p.surname].filter(Boolean).join(" ");
const when = d => new Date(d).toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"});
const initials = p => ((p && p.first_name || "?")[0] + (p && p.surname || "")[0]).toUpperCase();

const Field = ({label,children}) => html`<label class="field"><span>${label}</span>${children}</label>`;
const Note = ({kind,children}) => children ? html`<div class=${"note "+(kind||"")} role="status">${children}</div>` : null;
const Empty = ({children}) => html`<div class="empty">${children}</div>`;

/* ---------------- AUTH ---------------- */
function Crest({school}){
  return html`<div class="crest" aria-hidden="true">${school && school.logo_url ? html`<img src=${school.logo_url} alt="" />` : ((school && school.name || "S")[0])}</div>`;
}

function Auth({school}){
  const [mode,setMode] = useState("welcome");
  const [f,setF] = useState({first:"",middle:"",surname:"",dob:"",phone:"",email:"",password:"",role:"student"});
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState(null);
  const set = k => e => setF({...f,[k]:e.target.value});
  const go = m => { setMsg(null); setMode(m); };

  async function login(e){
    e.preventDefault(); setBusy(true); setMsg(null);
    const {error} = await sb.auth.signInWithPassword({email:f.email.trim(),password:f.password});
    setBusy(false);
    if(error) setMsg({kind:"bad",text:error.message});
  }
  async function signup(e){
    e.preventDefault(); setMsg(null);
    if(!f.first.trim() || !f.surname.trim()) return setMsg({kind:"bad",text:"Enter your first name and surname."});
    if(f.password.length < 8) return setMsg({kind:"bad",text:"Use a password of at least 8 characters."});
    setBusy(true);
    const {data,error} = await sb.auth.signUp({
      email:f.email.trim(), password:f.password,
      options:{data:{first_name:f.first.trim(),middle_name:f.middle.trim(),surname:f.surname.trim(),date_of_birth:f.dob,phone:f.phone.trim(),requested_role:f.role}}
    });
    setBusy(false);
    if(error) return setMsg({kind:"bad",text:error.message});
    if(!data.session) setMsg({kind:"good",text:"Account created. Check your email to confirm it, then log in."});
  }
  async function forgot(e){
    e.preventDefault(); setBusy(true); setMsg(null);
    const {error} = await sb.auth.resetPasswordForEmail(f.email.trim(),{redirectTo:location.origin+location.pathname});
    setBusy(false);
    setMsg(error ? {kind:"bad",text:error.message} : {kind:"good",text:"If that email has an account, a reset link is on its way."});
  }
  async function google(){
    const {error} = await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
    if(error) setMsg({kind:"bad",text:error.message});
  }

  const head = html`<${Crest} school=${school} /><h1>${school ? school.name : "Smart School"}</h1>${school && school.motto ? html`<p class="motto">${school.motto}</p>` : null}`;

  if(mode==="welcome") return html`<main class="book">
    ${head}
    <p>Welcome. Sign in to see announcements, classes, results and more.</p>
    <div class="stack">
      <button class="btn" onClick=${()=>go("signup")}>Sign up</button>
      <button class="btn alt" onClick=${()=>go("login")}>Log in</button>
      <button class="btn alt" onClick=${google}>Continue with Google</button>
      <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
    </div>
  </main>`;

  if(mode==="login") return html`<main class="book">
    ${head}
    <form class="stack" onSubmit=${login}>
      <${Field} label="Email"><input type="email" required autocomplete="email" value=${f.email} onInput=${set("email")} /><//>
      <${Field} label="Password"><input type="password" required autocomplete="current-password" value=${f.password} onInput=${set("password")} /><//>
      <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
      <button class="btn" disabled=${busy}>${busy ? "Logging in..." : "Log in"}</button>
      <button type="button" class="link" onClick=${()=>go("forgot")}>Forgot password?</button>
      <button type="button" class="link" onClick=${()=>go("welcome")}>Back</button>
    </form>
  </main>`;

  if(mode==="forgot") return html`<main class="book">
    ${head}
    <form class="stack" onSubmit=${forgot}>
      <p class="muted">Enter your email and we will send a link to set a new password.</p>
      <${Field} label="Email"><input type="email" required value=${f.email} onInput=${set("email")} /><//>
      <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
      <button class="btn" disabled=${busy}>Send reset link</button>
      <button type="button" class="link" onClick=${()=>go("login")}>Back to log in</button>
    </form>
  </main>`;

  return html`<main class="book">
    ${head}
    <form class="stack" onSubmit=${signup}>
      <${Field} label="First name"><input required value=${f.first} onInput=${set("first")} autocomplete="given-name" /><//>
      <${Field} label="Middle name (if any)"><input value=${f.middle} onInput=${set("middle")} autocomplete="additional-name" /><//>
      <${Field} label="Surname"><input required value=${f.surname} onInput=${set("surname")} autocomplete="family-name" /><//>
      <${Field} label="Date of birth"><input type="date" value=${f.dob} onInput=${set("dob")} /><//>
      <${Field} label="Phone number"><input type="tel" value=${f.phone} onInput=${set("phone")} autocomplete="tel" /><//>
      <${Field} label="Email"><input type="email" required value=${f.email} onInput=${set("email")} autocomplete="email" /><//>
      <${Field} label="Password (8+ characters)"><input type="password" required minlength="8" value=${f.password} onInput=${set("password")} autocomplete="new-password" /><//>
      <${Field} label="I am a">
        <select value=${f.role} onChange=${set("role")}>
          <option value="student">Student</option>
          <option value="parent">Parent</option>
          <option value="teacher">Teacher</option>
          <option value="vice_principal">Vice Principal</option>
        </select>
      <//>
      <p class="small muted">Staff and student accounts are checked by the school before they are active. Proprietor accounts are created by the school owner only.</p>
      <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
      <button class="btn" disabled=${busy}>${busy ? "Creating..." : "Create account"}</button>
      <button type="button" class="link" onClick=${()=>go("welcome")}>Back</button>
    </form>
  </main>`;
}

function Recovery({school,done}){
  const [pw,setPw] = useState(""); const [msg,setMsg] = useState(null);
  async function save(e){
    e.preventDefault();
    if(pw.length < 8) return setMsg({kind:"bad",text:"Use at least 8 characters."});
    const {error} = await sb.auth.updateUser({password:pw});
    if(error) setMsg({kind:"bad",text:error.message}); else done();
  }
  return html`<main class="book"><${Crest} school=${school} /><h1>Set a new password</h1>
    <form class="stack" onSubmit=${save}>
      <${Field} label="New password"><input type="password" required minlength="8" value=${pw} onInput=${e=>setPw(e.target.value)} autocomplete="new-password" /><//>
      <${Note} kind=${msg && msg.kind}>${msg && msg.text}<//>
      <button class="btn">Save password</button>
    </form></main>`;
}

function Pending({profile,school}){
  const off = profile && profile.status === "deactivated";
  return html`<main class="book"><${Crest} school=${school} />
    <h1>${off ? "Account deactivated" : "Waiting for approval"}</h1>
    <p>${off ? "This account has been switched off. Please contact the school office." :
      "Thanks for registering"+(profile ? ", "+profile.first_name : "")+". The school needs to check your details before you can use the app. Come back after you have been approved."}</p>
    <div class="stack">
      <button class="btn alt" onClick=${()=>location.reload()}>Check again</button>
      <button class="btn" onClick=${()=>sb.auth.signOut()}>Log out</button>
    </div></main>`;
}

/* ---------------- HOME / ANNOUNCEMENTS ---------------- */
function Home({profile,isOwner}){
  const [items,setItems] = useState(null);
  const [cm,setCm] = useState([]);
  const [names,setNames] = useState({});
  const [err,setErr] = useState("");
  const [title,setTitle] = useState(""); const [body,setBody] = useState("");
  const [open,setOpen] = useState({}); const [draft,setDraft] = useState({});
  const canPost = isOwner || (profile.permissions && profile.permissions.publish_announcements === true);

  const load = useCallback(async()=>{
    const a = await sb.from("announcements").select("*").order("created_at",{ascending:false}).limit(30);
    if(a.error) return setErr(a.error.message);
    let comments = [];
    if(a.data.length){
      const c = await sb.from("announcement_comments").select("*").in("announcement_id",a.data.map(x=>x.id)).order("created_at");
      comments = c.data || [];
    }
    const ids = [...new Set([...a.data.map(x=>x.author_id),...comments.map(x=>x.author_id)])];
    if(ids.length){
      const n = await sb.from("people_names").select("*").in("id",ids);
      const map = {}; (n.data||[]).forEach(p=>{map[p.id]=p;}); setNames(map);
    }
    setCm(comments); setItems(a.data);
  },[]);
  useEffect(()=>{load();},[load]);

  async function post(e){
    e.preventDefault(); setErr("");
    const {error} = await sb.from("announcements").insert({title:title.trim(),body:body.trim()});
    if(error) return setErr(error.message);
    setTitle(""); setBody(""); load();
  }
  async function comment(id){
    const text = (draft[id]||"").trim(); if(!text) return;
    const {error} = await sb.from("announcement_comments").insert({announcement_id:id,body:text});
    if(error) return setErr(error.message);
    setDraft({...draft,[id]:""}); load();
  }
  async function hide(c){ await sb.from("announcement_comments").update({hidden:true}).eq("id",c.id); load(); }
  async function removePost(id){
    if(!confirm("Delete this announcement?")) return;
    const {error} = await sb.from("announcements").delete().eq("id",id);
    if(error) setErr(error.message); else load();
  }
  const who = id => names[id] ? fullName(names[id]) : "School";

  return html`<div class="page">
    <h2>Announcements</h2>
    <${Note} kind="bad">${err}<//>
    ${canPost ? html`<form class="panel" onSubmit=${post}>
      <h3>New announcement</h3>
      <${Field} label="Title"><input required maxlength="120" value=${title} onInput=${e=>setTitle(e.target.value)} /><//>
      <${Field} label="Details"><textarea required value=${body} onInput=${e=>setBody(e.target.value)}></textarea><//>
      <button class="btn">Publish</button>
    </form>` : null}
    ${items === null ? html`<${Empty}>Loading...<//>` : items.length === 0 ? html`<${Empty}>No announcements yet.<//>` :
      items.map(a => {
        const mine = cm.filter(c => c.announcement_id === a.id);
        const visible = mine.filter(c => !c.hidden);
        return html`<article class="panel" key=${a.id}>
          <h3 class="post-title">${a.title}</h3>
          <div class="small muted">${who(a.author_id)}${names[a.author_id] ? " · "+ROLE[names[a.author_id].role] : ""} · ${when(a.created_at)}</div>
          <div style="white-space:pre-wrap">${a.body}</div>
          <div class="row">
            <button class="link" onClick=${()=>setOpen({...open,[a.id]:!open[a.id]})}>${visible.length} comment${visible.length===1?"":"s"}</button>
            ${(isOwner || a.author_id===profile.id) ? html`<button class="link" onClick=${()=>removePost(a.id)}>Delete</button>` : null}
          </div>
          ${open[a.id] ? html`<div class="stack" style="max-width:none">
            ${visible.map(c => html`<div class="comment" key=${c.id}>
              <div class="small"><b>${who(c.author_id)}</b> <span class="muted">${when(c.created_at)}</span></div>
              <div>${c.body}</div>
              ${(isOwner || a.author_id===profile.id) ? html`<button class="link small" onClick=${()=>hide(c)}>Hide comment</button>` : null}
            </div>`)}
            <div class="row">
              <input class="inp grow" placeholder="Write a comment" maxlength="1000" value=${draft[a.id]||""} onInput=${e=>setDraft({...draft,[a.id]:e.target.value})} />
              <button class="btn sm" onClick=${()=>comment(a.id)}>Send</button>
            </div>
          </div>` : null}
        </article>`;
      })}
  </div>`;
}

/* ---------------- CLASSES ---------------- */
const LEVELS = [["1","JSS1"],["2","JSS2"],["3","JSS3"],["4","SS1"],["5","SS2"],["6","SS3"]];

function Classes({profile,isOwner}){
  const [list,setList] = useState(null); const [sel,setSel] = useState(null);
  const [err,setErr] = useState(""); const [name,setName] = useState(""); const [level,setLevel] = useState("1");

  const load = useCallback(async()=>{
    const {data,error} = await sb.from("class_overview").select("*").order("level").order("name");
    if(error) return setErr(error.message);
    let rows = data;
    if(profile.role === "teacher"){
      const t = await sb.from
