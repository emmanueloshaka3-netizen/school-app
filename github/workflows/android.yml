name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Set the app icon
        run: |
          RES=android/app/src/main/res
          SRC=icon-maskable-512.png
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            convert "$SRC" -resize ${2}x${2} "$RES/mipmap-$1/ic_launcher.png"
            convert "$SRC" -resize ${2}x${2} "$RES/mipmap-$1/ic_launcher_round.png"
            convert "$SRC" -resize ${3}x${3} "$RES/mipmap-$1/ic_launcher_foreground.png"
          done

      - name: Build the app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk smart-school.apk

      - name: Publish for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Smart School app (latest)
          files: smart-school.apk